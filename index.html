<body>
  <div id="app"></div>
  <div id="overlay-root"></div>
  <div id="tooltip"></div>
  <div id="toast"></div>

  <script src="engine.js"></script>
  <script>
  (function () {
    'use strict';
    /* 语言：默认英文；localStorage 读写都包在 try/catch 里。
       engine.js 加载失败时也要显示正确语言，所以这段放在 E 检查之前。 */
    const LANG_KEY = 'vfxRogue.lang';
    const BOOT_ERROR = { en: 'engine.js failed to load.', zh: 'engine.js 没有加载成功。' };

    function readStoredLang() {
      try {
        const stored = window.localStorage.getItem(LANG_KEY);
        if (stored === 'en' || stored === 'zh') return stored;
      } catch (err) { /* localStorage 不可用 */ }
      return 'en';
    }
    function saveLang(value) {
      try { window.localStorage.setItem(LANG_KEY, value); } catch (err) { /* 忽略 */ }
    }

    const E = window.VFXEngine;
    if (!E) {
      document.body.innerHTML = '<div style="padding:40px;color:#ff6471">' + BOOT_ERROR[readStoredLang()] + '</div>';
      return;
    }
    const C = E.CONFIG;
    const P = E.PORTS;
    const D = E.DEPARTMENTS;
    const N = E.NODE_DEFS;
    const R = E.RELICS;

    let lang = readStoredLang();

    function t(key, vars) {
      let s = E.t(key, lang);
      if (vars) {
        Object.keys(vars).forEach(function (name) {
          s = s.split('{' + name + '}').join(String(vars[name]));
        });
      }
      return s;
    }
    function tr(value) { return E.L(value, lang); }
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('app.title');

    let game = new E.Game();
    window.__VFX_GAME__ = game;

    const ui = {
      selectedUid: null,
      busy: false,
      modal: null,
      lastOutcome: null,
      lastPreview: null,
      /* 窄屏专用界面状态 */
      companyOpen: false,
      nodeDetail: null,   /* { row, col } */
      cardInfoUid: null,
      bondId: null,
      longPressed: false
    };
    const narrowMedia = window.matchMedia('(max-width: 899px)');
    /* 手机横屏专用布局：优先于 <900px 竖屏，桌面（高度 > 520）不受影响。 */
    const landscapeMedia = window.matchMedia('(orientation: landscape) and (max-height: 520px)');
    function isNarrow() { return narrowMedia.matches; }
    function isLandscape() { return landscapeMedia.matches; }
    function isCompact() { return isNarrow() || isLandscape(); }

    const app = document.getElementById('app');
    const overlayRoot = document.getElementById('overlay-root');
    const tooltip = document.getElementById('tooltip');
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    /* ============================================================
     * 工具
     * ============================================================ */
    const $ = (sel) => document.querySelector(sel);
    const state = () => game.state;
    const isPlaying = () => game.state.phase === 'playing' && game.state.status === 'playing' && !ui.busy;

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function fmt(n) {
      if (n == null || !isFinite(n)) return '—';
      const r = Math.round(n * 10) / 10;
      if (Math.abs(r) >= 10000) {
        return (r / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      }
      if (Number.isInteger(r)) return String(r);
      return r.toFixed(1);
    }

    function money(n) {
      const v = Math.round(n);
      return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US');
    }

    function tierName(tier) {
      return t(tier === 'boss' ? 'tier.boss' : tier === 'mid' ? 'tier.mid' : 'tier.side');
    }

    function tierShort(tier) {
      return t(tier === 'boss' ? 'tierShort.boss' : tier === 'mid' ? 'tierShort.mid' : 'tierShort.side');
    }

    function deptStyle(dept) {
      return '--dept-color:' + (D[dept] ? D[dept].color : '#e8e8e8');
    }

    function portShape(t, extra, scale) {
      if (!t || !P[t]) return '';
      const cls = extra ? ' ' + extra : '';
      return '<span class="port ' + t + cls + '"></span>';
    }

    function portLabel(pt) {
      return pt && P[pt] ? tr(P[pt].name) : '—';
    }

    function inputLabel(def) {
      if (def.source) return t('node.inputSource');
      if (def.special === 'merge') return t('node.inputMerge');
      return def.input.map(function (x) { return tr(P[x].name); }).join(' / ');
    }

    function approxHours(card) {
      const def = N[card.type];
      let h = def.hours;
      if (def.dept === 'fx') {
        h += (Math.max(1, Math.min(4, card.substep || 1)) - 1);
        if (game.hasRelic('houdini')) h = Math.max(1, h - 1);
      }
      if (def.dept === 'comp' && game.hasRelic('nuke')) h = 0;
      return h;
    }

    function opLabel(def) {
      if (def.source) return '<span>' + def.base + '</span><small>' + esc(tr(P[def.output].name)) + '</small>';
      if (def.special === 'merge') return '<span>' + esc(t('node.sumLabel')) + '</span><small>' + esc(t('hand.multiOut')) + '</small>';
      if (def.type === 'grade') return '<span>×1.15+</span>';
      if (def.type === 'rbd') return '<span>' + esc(t('node.rbdLabel')) + '</span>';
      if (def.flat != null) return '<span>+' + def.flat + '</span>';
      return '<span>×' + fmt(def.mult) + '</span>';
    }

    function ioMarkup(def, outType) {
      let inp;
      if (def.source) {
        inp = '<span style="font-size:6px;opacity:.65;font-weight:800">' + esc(t('node.sourceLabel')) + '</span>';
      } else if (def.special === 'merge') {
        inp = '<span style="font-size:6.5px;opacity:.8;font-weight:800">↙←↖</span>';
      } else {
        inp = def.input.map(function (t) { return portShape(t); }).join('');
      }
      return inp + '<span class="arrow">›</span>' + (outType ? portShape(outType, 'out') : '');
    }

    function timeLabel(h) {
      return (Number.isInteger(h) ? h : fmt(h)) + 'h';
    }

    function nodeTip(cell, def, card, preview) {
      const lines = [];
      lines.push(t('node.tipTitle', { name: tr(def.name), dept: tr(D[def.dept].name) }));
      lines.push(t('node.inputOutput', {
        input: inputLabel(def),
        output: cell.outputType ? portLabel(cell.outputType) : t('node.noOutput')
      }));
      lines.push(t('node.hours', { hours: timeLabel(cell.hours) }) + (def.dept === 'fx' ? t('node.substepSuffix') + card.substep : ''));
      if (cell.passThrough) {
        lines.push(t('node.passThroughTip'));
      } else {
        lines.push(t('node.estimate', { value: cell.supplied ? fmt(cell.value) : t('node.notSupplied') }));
      }
      if (def.dept === 'fx' && !def.neverExplodes && !cell.passThrough) {
        const chance = E.explosionChance(card.substep, !!(preview && preview.bondActive.fx));
        lines.push(t('node.explosionChance', { chance: chance }));
      }
      if (cell.auraMultiplier > 1.001) lines.push(t('node.auraBonus', { mult: fmt(cell.auraMultiplier) }));
      if (card.upgraded) lines.push(t('node.upgraded', { mult: C.upgradeMultiplier }));
      if (card.vexed) lines.push(t('node.vexed'));
      lines.push('');
      lines.push(tr(def.desc));
      if (isPlaying()) lines.push(t('node.clickToRemove'));
      return lines.join('\n');
    }

    function handTip(card) {
      const def = N[card.type];
      const lines = [
        t('node.tipTitle', { name: tr(def.name), dept: tr(D[def.dept].name) }),
        t('node.inputOutput', {
          input: inputLabel(def),
          output: def.output ? portLabel(def.output) : t('node.outputByInput')
        }),
        t('hand.baseHours', { hours: timeLabel(approxHours(card)) }) + (def.dept === 'fx' ? t('node.substepSuffix') + card.substep : ''),
        '',
        tr(def.desc)
      ];
      if (card.upgraded) lines.push(t('node.upgraded', { mult: C.upgradeMultiplier }));
      lines.push(t('node.clickToSelect'));
      return lines.join('\n');
    }

    function showToast(text, kind) {
      if (!text) return;
      toastEl.textContent = text;
      toastEl.className = 'show' + (kind ? ' ' + kind : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = ''; }, 2100);
    }

    function bondInfo() {
      return [
        { id: 'model', name: t('bond.modelName'), effect: t('bond.modelEffect', { n: C.modelBondBonus }) },
        { id: 'fx', name: t('bond.fxName'), effect: t('bond.fxEffect', { n: Math.round(C.fxBondExplosionReduction * 100) }) },
        { id: 'lighting', name: t('bond.lightingName'), effect: t('bond.lightingEffect') },
        { id: 'comp', name: t('bond.compName'), effect: t('bond.compEffect') }
      ];
    }

    /* ============================================================
     * 顶栏 / 公司 / 网格 / 手牌 / 侧栏
     * ============================================================ */
    function renderTop() {
      const s = state();
      const lv = game.level;
      const relicIcons = s.relics.length
        ? s.relics.map(function (id) {
            const r = R[id];
            return '<span class="relic-icon" data-tip="' + esc(tr(r.name) + '\n' + tr(r.desc)) + '">' + esc(r.icon) + '</span>';
          }).join('')
        : '<span class="relic-icon empty" data-tip="' + esc(t('top.noRelicsTip')) + '">∅</span>';
      const monthText = t('top.monthLevel', { month: s.month, slot: lv ? lv.slot : 1 });
      return [
        '<header class="topbar">',
        '  <div class="brand">',
        '    <div class="brand-mark">◆</div>',
        '    <div><div class="brand-title">' + esc(t('app.brand')) + '</div><div class="brand-sub">' + esc(t('app.brandSub')) + '</div></div>',
        '  </div>',
        '  <div class="top-stats">',
        '    <div class="stat"><small>' + esc(t('top.monthLabel')) + '</small><b>' + esc(monthText) + '</b></div>',
        '    <div class="stat money"><small>' + esc(t('top.money')) + '</small><b>' + money(s.money) + '</b></div>',
        '    <div class="stat rent"><small>' + esc(t('top.rent')) + '</small><b>' + money(game.currentRent()) + '</b></div>',
        '    <div class="relic-strip" data-tip="' + esc(t('top.relicStripTip')) + '">' + relicIcons + '</div>',
        '  </div>',
        '  <div class="top-actions">',
        '    <button class="icon-btn" data-action="help" title="' + esc(t('top.helpTitle')) + '">' + esc(t('top.help')) + '</button>',
        '    <button class="icon-btn" data-action="deck" title="' + esc(t('top.deckTitle')) + '">' + esc(t('top.deck', { n: s.deck.length })) + '</button>',
        '    <button class="icon-btn" data-action="lang" data-tip="' + esc(t('top.langTip')) + '">' + esc(t('top.langToggle')) + '</button>',
        '  </div>',
        '</header>'
      ].join('');
    }

    function renderCompany(preview) {
      const lv = game.level;
      if (!lv) return '';
      const target = P[lv.targetOutput];
      const reward = lv.rewardMoney;
      const score = preview ? preview.displayTotal : 0;
      const success = preview ? preview.success : false;
      const progress = Math.max(0, Math.min(100, (score / Math.max(1, lv.targetScore)) * 100));
      return [
        '<aside class="panel company-panel" style="--dept:' + target.color + '">',
        '  <div class="company-topline"><span class="panel-label">' + esc(t('company.label')) + '</span><span class="tier-badge ' + lv.tier + '">' + esc(tierShort(lv.tier)) + '</span></div>',
        '  <h1 class="company-name">' + esc(tr(lv.companyName)) + '</h1>',
        '  <div class="company-sub">' + esc(tr(lv.companySlogan)) + '</div>',
        '  <div class="job-requirement">',
        '    <div class="job-req-label">' + esc(t('company.requiresOutput')) + '</div>',
        '    <div class="job-req-main"><span class="target-port-large ' + lv.targetOutput + '"></span><strong>' + esc(tr(target.name)) + '<small>' + lv.targetOutput + '</small></strong></div>',
        '    <div class="job-numbers">',
        '      <div class="job-number"><small>' + esc(t('company.targetScore')) + '</small><b>' + lv.targetScore + '</b></div>',
        '      <div class="job-number"><small>' + esc(t('company.cookBudget')) + '</small><b>' + (preview ? preview.budget : game.getBudget()) + 'h</b></div>',
        '      <div class="job-number"><small>' + esc(t('company.cashReward')) + '</small><b>' + money(reward) + '</b></div>',
        '      <div class="job-number"><small>' + esc(t('company.currentEstimate')) + '</small><b style="color:' + (success ? 'var(--good)' : 'var(--accent)') + '">' + fmt(score) + '</b></div>',
        '    </div>',
        '    <div class="progress ' + (success ? 'good' : '') + '"><i style="width:' + progress + '%"></i></div>',
        '  </div>',
        '  <div class="rule-box" data-tip="' + esc(tr(lv.ruleDesc)) + '">',
        '    <div class="rule-name">' + esc(t('company.specialRule', { name: tr(lv.ruleName) })) + '</div>',
        '    <div class="rule-desc">' + esc(tr(lv.ruleDesc)) + '</div>',
        '  </div>',
        '  <div class="company-foot"><span>' + esc(t('company.footerLevel', { index: lv.index + 1, tier: tierName(lv.tier) })) + '</span><span>' + esc(t('misc.cook')) + ' <b>' + state().cooksLeft + '</b> / ' + state().cooksTotal + '</span></div>',
        '</aside>'
      ].join('');
    }

    function renderNode(cell, card, preview) {
      const def = N[card.type];
      const chance = def.dept === 'fx' && !def.neverExplodes && !cell.passThrough
        ? E.explosionChance(card.substep, preview.bondActive.fx)
        : 0;
      const isActive = cell.supplied;
      const canControl = isPlaying();
      const classes = [
        'node', 'dept-' + def.dept
      ];
      if (!isActive) classes.push('disconnected');
      if (cell.passThrough) classes.push('pass-through');
      if (cell.auraMultiplier > 1.001) classes.push('aura-target');
      const controls = def.dept === 'fx' && !cell.passThrough
        ? '<div class="node-stepper" data-no-remove="1">' +
            '<button data-action="substep" data-uid="' + esc(card.uid) + '" data-delta="-1" ' + (!canControl ? 'disabled' : '') + '>−</button>' +
            '<span>S' + card.substep + '</span>' +
            '<button data-action="substep" data-uid="' + esc(card.uid) + '" data-delta="1" ' + (!canControl ? 'disabled' : '') + '>+</button>' +
          '</div>'
        : '';
      const canVex = canControl && !cell.passThrough && game.hasRelic('vex') && !state().vexUsed;
      const corner = [];
      if (cell.passThrough) corner.push('<span class="badge-mini" data-tip="' + esc(t('node.directPassTip')) + '">' + esc(t('node.directPass')) + '</span>');
      if (card.upgraded) corner.push('<span class="badge-mini star" data-tip="' + esc(t('node.upgradedBadgeTip', { mult: C.upgradeMultiplier })) + '">★</span>');
      if (card.vexed) corner.push('<span class="badge-mini vex" data-tip="' + esc(t('node.vexBadgeTip')) + '">' + esc(tr(R.vex.name)) + '</span>');
      else if (canVex) corner.push('<button class="vex-btn" data-action="vex" data-uid="' + esc(card.uid) + '" data-tip="' + esc(t('node.vexButtonTip')) + '">' + esc(tr(R.vex.name)) + '</button>');
      if (chance > 0) corner.push('<span class="badge-mini risk" data-tip="' + esc(t('node.riskBadgeTip', { chance: chance })) + '">☢' + chance + '%</span>');
      const val = cell.supplied ? fmt(cell.value) : '—';
      const tip = nodeTip(cell, def, card, preview);
      return [
        '<div class="' + classes.join(' ') + '" data-row="' + cell.row + '" data-col="' + cell.col + '" data-uid="' + esc(card.uid) + '" data-tip="' + esc(tip) + '">',
        '  <div class="node-head"><div class="node-name">' + esc(tr(def.name)) + '<span class="node-cn">' + esc(tr(D[def.dept].name)) + '</span></div></div>',
        '  <div class="node-mid"><span class="node-value' + (cell.supplied ? '' : ' empty-value') + '">' + val + '</span><span class="node-hours">' + timeLabel(cell.hours) + '</span></div>',
        '  <div class="node-foot"><span class="ports">' + ioMarkup(def, cell.outputType) + '</span>' + controls + '</div>',
        '  <div class="node-corner">' + corner.join('') + '</div>',
        '</div>'
      ].join('');
    }

    function renderOutput(preview, row) {
      const lv = game.level;
      const info = preview.rows[row];
      const target = lv.targetOutput;
      const has = info.hasNode;
      let cls = 'out-slot';
      if (!has) cls += ' empty-out';
      else if (info.targetMatch) cls += ' match';
      else if (info.supplied) cls += ' mismatch';
      let value = '—';
      if (info.supplied) value = info.targetMatch ? fmt(info.score) : fmt(info.value);
      let tip = t('output.tipHeader', { row: row + 1 }) + '\n' + t('output.tipRule', { port: portLabel(target) });
      if (has) {
        tip += '\n' + t('output.tipCurrent', { port: portLabel(info.outputType), value: fmt(info.value) });
        if (!info.targetMatch) tip += '\n' + t('output.tipMismatch');
        else if (info.generalistHalved) tip += '\n' + t('output.tipGeneralist');
      } else {
        tip += '\n' + t('output.tipEmpty');
      }
      return [
        '<div class="' + cls + '" data-row="' + row + '" data-tip="' + esc(tip) + '">',
        '  <div class="out-top">' + esc(t('output.label', { n: row + 1 })) + '</div>',
        '  <div class="out-mid"><span class="target-port-large ' + target + '" style="width:15px;height:15px"></span><span class="out-value ' + (info.targetMatch ? '' : 'muted') + '">' + value + '</span></div>',
        '  <div class="out-type">' + esc(has ? portLabel(info.outputType) : t('output.waiting')) + '</div>',
        '</div>'
      ].join('');
    }

    function renderBoard(preview) {
      const cells = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 6; c++) {
          const card = state().grid[r][c];
          if (card) {
            const cell = preview.cells[r][c];
            cells.push(renderNode(cell, card, preview));
          } else {
            const ready = isPlaying() && ui.selectedUid;
            cells.push(
              '<button class="cell empty' + (ready ? ' drop-ready' : '') + '" data-row="' + r + '" data-col="' + c + '" data-tip="' +
              esc(ready ? t('board.placeTip') : t('board.emptyCellTip')) + '">' +
              '<span class="cell-plus">+</span><span class="cell-coord">' + (r + 1) + '-' + (c + 1) + '</span></button>'
            );
          }
        }
        cells.push(renderOutput(preview, r));
      }
      return [
        '<section class="panel board-panel">',
        '  <div class="board-head"><span><strong>' + esc(t('board.title')) + '</strong> <span class="dim">' + esc(t('board.subtitle')) + '</span></span><span class="flow-hint">' + esc(t('board.flowHint')) + ' <i></i> ' + esc(t('board.flowTarget')) + '</span></div>',
        '  <div class="board-shell" id="board-shell">',
        '    <svg id="wire-svg" aria-hidden="true"></svg>',
        '    <div class="board" id="board">' + cells.join('') + '</div>',
        '  </div>',
        '</section>'
      ].join('');
    }

    function renderHand() {
      const s = state();
      const cards = s.hand.map(function (card) {
        const def = N[card.type];
        const selected = ui.selectedUid === card.uid;
        const fx = def.dept === 'fx';
        const tip = handTip(card);
        const canControl = isPlaying();
        return [
          '<div class="hand-card dept-' + def.dept + (selected ? ' selected' : '') + (card.vexed ? ' vexed' : '') + '" ',
          'data-action="select-hand" data-uid="' + esc(card.uid) + '" style="' + deptStyle(def.dept) + '" data-tip="' + esc(tip) + '">',
          '  <div class="hc-top"><div><div class="hc-name">' + esc(tr(def.name)) + '</div><div class="hc-cn">' + esc(tr(D[def.dept].name)) + '</div></div>' + (card.upgraded ? '<span class="hc-star" data-tip="' + esc(t('node.upgradedBadgeTip', { mult: C.upgradeMultiplier })) + '">★</span>' : '') + '</div>',
          '  <div class="hc-op">' + opLabel(def) + '</div>',
          '  <div class="hc-meta">' + timeLabel(approxHours(card)) + ' · ' + esc(def.output ? tr(P[def.output].name) : t('hand.multiOut')) + '</div>',
          '  <div class="hc-portline">' + ioMarkup(def, def.output) + '</div>',
          '  <div class="hc-bottom">',
          fx ? ('<div class="node-stepper"><button data-action="substep" data-uid="' + esc(card.uid) + '" data-delta="-1" ' + (!canControl ? 'disabled' : '') + '>−</button><span>S' + card.substep + '</span><button data-action="substep" data-uid="' + esc(card.uid) + '" data-delta="1" ' + (!canControl ? 'disabled' : '') + '>+</button></div>') : '<span></span>',
          card.vexed ? '<span class="badge-mini vex">' + esc(tr(R.vex.name)) + '</span>' : '',
          '  </div>',
          '</div>'
        ].join('');
      }).join('');
      return [
        '<section class="panel hand-panel">',
        '  <div class="hand-head"><strong>' + esc(t('hand.title')) + '</strong><span>' + esc(ui.selectedUid ? t('hand.selectedHint') : t('hand.hint')) + '</span></div>',
        '  <div class="hand-list">' + (cards || '<div class="hand-empty">' + esc(t('hand.empty')) + '</div>') + '</div>',
        '</section>'
      ].join('');
    }

    function canCookInfo(preview) {
      if (ui.busy) return { ok: false, reason: t('err.cooking') };
      if (state().phase !== 'playing' || state().status !== 'playing') return { ok: false, reason: t('err.levelOver') };
      if (state().cooksLeft <= 0) return { ok: false, reason: t('err.noCooksLeft') };
      if (preview.overBudget) return { ok: false, reason: t('err.overBudgetNoCook') };
      return { ok: true, reason: '' };
    }

    function renderSide(preview) {
      const s = state();
      const lv = game.level;
      const can = canCookInfo(preview);
      const target = lv.targetScore;
      const score = preview.displayTotal;
      const progress = Math.max(0, Math.min(100, (score / Math.max(1, target)) * 100));
      const over = preview.overBudget;
      const budgetPct = Math.min(100, (preview.hours / Math.max(1, preview.budget)) * 100);
      const bondRows = bondInfo().map(function (b) {
        const count = preview.bonds[b.id];
        const active = preview.bondActive[b.id];
        return [
          '<div class="bond ' + b.id + (active ? ' active' : '') + '">',
          '  <span class="dot"></span>',
          '  <span><span class="b-name">' + b.name + '</span><span class="b-eff">' + b.effect + '</span></span>',
          '  <span class="b-count">' + count + '/3</span>',
          '</div>'
        ].join('');
      }).join('');
      const rowRows = preview.rows.map(function (row, i) {
        let status = '—';
        let val = row.supplied ? fmt(row.value) : '—';
        if (row.targetMatch) {
          val = fmt(row.score);
          status = '✓';
        } else if (row.supplied) {
          status = '✕';
        }
        return [
          '<div class="score-row ' + (row.targetMatch ? 'ok' : (row.supplied ? 'bad' : '')) + '">',
          '  <span class="sr-tag">R' + (i + 1) + '</span>',
          '  <span class="sr-type">' + esc(row.hasNode ? portLabel(row.outputType) : t('score.empty')) + esc(row.generalistHalved ? t('score.halved') : '') + '</span>',
          '  <span class="sr-val">' + val + '</span>',
          '  <span class="sr-check">' + status + '</span>',
          '</div>'
        ].join('');
      }).join('');
      let maxRisk = 0;
      preview.placed.forEach(function (cell) {
        if (cell.dept === 'fx' && !cell.def.neverExplodes && !cell.passThrough) {
          maxRisk = Math.max(maxRisk, E.explosionChance(cell.card.substep, preview.bondActive.fx));
        }
      });
      const attempts = [];
      for (let i = 0; i < s.cooksTotal; i++) {
        attempts.push('<span class="attempt-dot ' + (i < s.attempts ? 'used' : '') + '"></span>');
      }
      const specialNotes = [];
      if (preview.ruleId === 'specialist' && preview.specialistDept) {
        specialNotes.push('<div class="special-note">' + t('score.specialistNote', { dept: esc(tr(D[preview.specialistDept].name)) }) + '</div>');
      }
      if (preview.usdUsed) {
        specialNotes.push('<div class="special-note">' + t('score.usdNote') + '</div>');
      }
      if (preview.ruleId === 'generalist' && preview.rows.some(function (r) { return r.generalistHalved; })) {
        specialNotes.push('<div class="special-note warn">' + t('score.generalistNote') + '</div>');
      }
      const nextAttempt = Math.min(s.cooksTotal, s.attempts + 1);
      return [
        '<aside class="side-col">',
        '  <section class="panel score-panel">',

    function maxExplosionRisk(preview) {
      let maxRisk = 0;
      preview.placed.forEach(function (cell) {
        if (cell.dept === 'fx' && !cell.def.neverExplodes && !cell.passThrough) {
          maxRisk = Math.max(maxRisk, E.explosionChance(cell.card.substep, preview.bondActive.fx));
        }
      });
      return maxRisk;
    }

    function renderNodeMobile(cell, card, preview) {
      const def = N[card.type];
      const chance = def.dept === 'fx' && !def.neverExplodes && !cell.passThrough
        ? E.explosionChance(card.substep, preview.bondActive.fx)
        : 0;
      const classes = ['node', 'mobile-node', 'dept-' + def.dept];
      if (!cell.supplied) classes.push('disconnected');
      if (cell.passThrough) classes.push('pass-through');
      if (cell.auraMultiplier > 1.001) classes.push('aura-target');
      if (ui.nodeDetail && ui.nodeDetail.row === cell.row && ui.nodeDetail.col === cell.col) classes.push('selected-node');
      let mark = '';
      let markCls = '';
      if (card.vexed) { mark = '×2'; markCls = 'vex'; }
      else if (chance > 0) { mark = '☢'; markCls = 'risk'; }
      else if (cell.passThrough) { mark = '↦'; markCls = 'pass'; }
      else if (card.upgraded) { mark = '★'; markCls = 'star'; }
      const key = 'short.' + card.type;
      return [
        '<div class="' + classes.join(' ') + '" data-row="' + cell.row + '" data-col="' + cell.col + '" data-uid="' + esc(card.uid) + '" data-tip="' + esc(nodeTip(cell, def, card, preview)) + '">',
        mark ? '<span class="mn-mark ' + markCls + '">' + mark + '</span>' : '',
        '  <span class="mn-name">' + esc(t(key)) + '</span>',
        '  <span class="node-value mn-value' + (cell.supplied ? '' : ' empty-value') + '">' + (cell.supplied ? fmt(cell.value) : '—') + '</span>',
        '</div>'
      ].join('');
    }

    function renderOutputMobile(preview, row) {
      const lv = game.level;
      const info = preview.rows[row];
      const target = lv.targetOutput;
      let cls = 'out-slot';
      if (!info.hasNode) cls += ' empty-out';
      else if (info.targetMatch) cls += ' match';
      else if (info.supplied) cls += ' mismatch';
      let value = '—';
      if (info.supplied) value = info.targetMatch ? fmt(info.score) : fmt(info.value);
      let tip = t('output.tipHeader', { row: row + 1 }) + '\n' + t('output.tipRule', { port: portLabel(target) });
      if (info.hasNode) {
        tip += '\n' + t('output.tipCurrent', { port: portLabel(info.outputType), value: fmt(info.value) });
        if (!info.targetMatch) tip += '\n' + t('output.tipMismatch');
      } else {
        tip += '\n' + t('output.tipEmpty');
      }
      return [
        '<div class="' + cls + '" data-row="' + row + '" data-tip="' + esc(tip) + '">',
        '  <span class="out-top">O' + (row + 1) + '</span>',
        '  <span class="target-port-large ' + target + '"></span>',
        '  <span class="out-value ' + (info.targetMatch ? '' : 'muted') + '">' + value + '</span>',
        '</div>'
      ].join('');

    /* 按中间栏可用宽高，把 7 列 × 3 行排成最大正方形格子。 */
    function sizeLandscapeBoard() {
      const host = document.querySelector('.ls-board-host');
      const shell = document.getElementById('board-shell');
      const board = document.getElementById('board');
      if (!host || !shell || !board) return;
      const cs = window.getComputedStyle(shell);
      const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
      const gap = parseFloat(window.getComputedStyle(board).gap) || 4;
      const availW = host.clientWidth - padX - gap * 6;
      const availH = host.clientHeight - padY - gap * 2;
      const cell = Math.max(24, Math.floor(Math.min(availW / 7, availH / 3)));
      board.style.gridTemplateColumns = 'repeat(7, ' + cell + 'px)';
      board.style.gridAutoRows = cell + 'px';
    }

        : 0;
      const controls = [];
      if (isPlaying()) {
        controls.push('<button class="md-btn" data-action="node-detail-remove">' + esc(t('card.takeBack')) + '</button>');

    /* ============================================================
     * 连线绘制
     * ============================================================ */
    function centerOfElement(el, baseRect) {
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x: r.left - baseRect.left + r.width / 2, y: r.top - baseRect.top + r.height / 2 };
    }

    function drawWires(result) {
      const shell = document.getElementById('board-shell');
      const svg = document.getElementById('wire-svg');
      if (!shell || !svg || !result) return;
      const base = shell.getBoundingClientRect();
      const w = shell.clientWidth;
      const h = shell.clientHeight;
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      const parts = [];
      function centerNode(r, c) {
        return centerOfElement(shell.querySelector('.node[data-row="' + r + '"][data-col="' + c + '"]'), base);
      }
      function centerOut(r) {
        return centerOfElement(shell.querySelector('.out-slot[data-row="' + r + '"]'), base);
      }
      function line(a, b, color, cls, opt) {
        if (!a || !b) return;
        const id = 'wire-' + (parts.length);
        parts.push('<path id="' + id + '" class="wire ' + cls + '" d="M ' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' L ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '" stroke="' + color + '" stroke-width="' + (opt && opt.width ? opt.width : 2) + '" opacity="' + (opt && opt.opacity != null ? opt.opacity : .43) + '"></path>');
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        parts.push('<circle class="wire-bead" cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="3" fill="' + color + '" opacity="' + (opt && opt.opacity != null ? Math.min(1, opt.opacity + .28) : .72) + '"></circle>');
        if (opt && opt.cross) {
          parts.push('<text class="wire-x" x="' + mx.toFixed(1) + '" y="' + my.toFixed(1) + '">×</text>');
        }
      }
      result.connections.forEach(function (conn) {
        const a = centerNode(conn.from.row, conn.from.col);
        const b = centerNode(conn.to.row, conn.to.col);
        if (!a || !b) return;
        let color = conn.fromType && P[conn.fromType] ? P[conn.fromType].color : '#8b96a5';
        if (conn.connected) {
          line(a, b, color, 'connected', { opacity: .46 });
        } else if (conn.mismatch && conn.sourceActive) {
          line(a, b, '#ff6471', 'broken', { opacity: .78, cross: true, width: 2.2 });
        } else {
          line(a, b, '#6c7888', 'inactive broken', { opacity: .35, width: 1.6 });
        }
      });
      (result.outputConnections || []).forEach(function (conn) {
        const a = centerNode(conn.from.row, conn.from.col);
        const b = centerOut(conn.row);
        if (!a || !b) return;
        const color = conn.fromType && P[conn.fromType] ? P[conn.fromType].color : '#8b96a5';
        if (conn.connected && conn.typeMatch) {
          line(a, b, color, 'connected', { opacity: .53 });
        } else if (conn.connected) {
          line(a, b, '#ff6471', 'broken', { opacity: .7, cross: true });
        } else {
          line(a, b, '#6c7888', 'inactive broken', { opacity: .25, width: 1.5 });
        }
      });
      svg.innerHTML = parts.join('');
    }

    /* ============================================================
     * Cook 动画
     * ============================================================ */
    function animateCook(result, onDone) {
      const shell = document.getElementById('board-shell');
      if (!shell) { onDone(); return; }
      const base = shell.getBoundingClientRect();
      const w = shell.clientWidth;
      const h = shell.clientHeight;
      const SVGNS = 'http://www.w3.org/2000/svg';
      const layer = document.createElementNS(SVGNS, 'svg');
      layer.setAttribute('class', 'fx-layer');
      layer.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      shell.appendChild(layer);

      const nodeCenters = {};
      result.placed.forEach(function (cell) {
        const el = shell.querySelector('.node[data-row="' + cell.row + '"][data-col="' + cell.col + '"]');
        const p = centerOfElement(el, base);
        if (p) nodeCenters[cell.row + ':' + cell.col] = p;
      });
      const outCenters = {};
      for (let r = 0; r < 3; r++) {
        const p = centerOfElement(shell.querySelector('.out-slot[data-row="' + r + '"]'), base);
        if (p) outCenters[r] = p;
      }

      const dots = [];
      function addDot(from, to, color, delay) {
        if (!from || !to) return;
        const dot = document.createElementNS(SVGNS, 'circle');
        dot.setAttribute('r', '3.4');
        dot.setAttribute('fill', color);
        dot.setAttribute('class', 'cook-dot');
        dot.style.opacity = '0';
        layer.appendChild(dot);
        dots.push({ dot: dot, from: from, to: to, delay: delay, duration: 255 });
      }
      result.connections.forEach(function (conn) {
        if (!conn.connected) return;
        const src = result.cells[conn.from.row] && result.cells[conn.from.row][conn.from.col];
        if (!src || !src.supplied) return;
        const from = nodeCenters[conn.from.row + ':' + conn.from.col];
        const to = nodeCenters[conn.to.row + ':' + conn.to.col];
        const color = conn.fromType && P[conn.fromType] ? P[conn.fromType].color : '#e8edf5';
        addDot(from, to, color, 100 + conn.from.col * 250);
      });
      (result.outputConnections || []).forEach(function (conn) {
        const fc = conn.from.col;
        const src = result.cells[conn.row] && result.cells[conn.row][fc];
        if (!src || !src.supplied) return;
        const color = conn.fromType && P[conn.fromType] ? P[conn.fromType].color : '#ffd166';
        addDot(nodeCenters[conn.row + ':' + fc], outCenters[conn.row], color, 100 + (fc + 1) * 250);
      });

      function floatAt(center, text, color, cls) {
        if (!center) return;
        const div = document.createElement('div');
        div.className = 'float-label ' + (cls || '');
        div.textContent = text;
        if (color) div.style.color = color;
        div.style.left = center.x + 'px';
        div.style.top = center.y + 'px';
        shell.appendChild(div);
        setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 950);
      }

      /* 节点数字依次跳出 */
      result.placed.forEach(function (cell) {
        const el = shell.querySelector('.node[data-row="' + cell.row + '"][data-col="' + cell.col + '"]');
        if (!el) return;
        const delay = 100 + cell.col * 250;
        setTimeout(function () {
          el.classList.add('pop-anim');
          const valueEl = el.querySelector('.node-value');
          if (valueEl) {
            valueEl.textContent = cell.supplied ? fmt(cell.value) : '0';
            valueEl.classList.toggle('empty-value', !cell.supplied);
          }
          if (!cell.supplied) el.classList.add('cooking-dead');
          if (cell.exploded) {
            el.classList.add('boom-anim', 'exploded');
            const center = nodeCenters[cell.row + ':' + cell.col];
            floatAt(center, t('cook.boom'), '#ff6471', 'boom');
          } else if (cell.rescued) {
            el.classList.add('rescued');
            const center = nodeCenters[cell.row + ':' + cell.col];
            floatAt(center, t('cook.rescue', { value: fmt(cell.value) }), '#8bffcf');
          } else if (cell.supplied) {
            const center = nodeCenters[cell.row + ':' + cell.col];
            floatAt(center, fmt(cell.value), cell.outputType && P[cell.outputType] ? P[cell.outputType].color : '#ffd166');
          }
        }, delay);
      });

      /* 输出口数字 */
      setTimeout(function () {
        result.rows.forEach(function (row, r) {
          const el = shell.querySelector('.out-slot[data-row="' + r + '"]');
          if (!el) return;
          const val = el.querySelector('.out-value');
          if (val) {
            val.textContent = row.supplied ? (row.targetMatch ? fmt(row.score) : fmt(row.value)) : '—';
            val.classList.toggle('muted', !row.targetMatch);
          }
          if (row.targetMatch) el.classList.add('match');
        });
      }, 1600);

      const start = performance.now();
      function frame(now) {
        const elapsed = now - start;
        dots.forEach(function (d) {
          const t = (elapsed - d.delay) / d.duration;
          if (t < 0 || t > 1) {
            d.dot.style.opacity = '0';
            return;
          }
          const ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          const x = d.from.x + (d.to.x - d.from.x) * ease;
          const y = d.from.y + (d.to.y - d.from.y) * ease;
          d.dot.setAttribute('cx', x);
          d.dot.setAttribute('cy', y);
          d.dot.style.opacity = t < .12 ? String(t / .12) : String(Math.max(0, 1 - (t - .75) / .25));
        });
        if (elapsed < 1950) {
          requestAnimationFrame(frame);
        } else {
          layer.remove();
          setTimeout(onDone, 220);
        }
      }
      requestAnimationFrame(frame);
    }

          '      <div class="result-sub">' + esc(title) + ' · ' + esc(sub) + '</div>',

          '      <div class="result-stat"><small>' + esc(t('result.statHours')) + '</small><b>' + fmt(res.hours) + ' / ' + res.budget + 'h</b></div>',

      ].join('');

    function renderShopOverlay() {
      const s = game.state;
      const shop = s.shop;
      if (!shop) return '';
      const lv = game.level;
      const ll = s.lastLevelResult;
      const offers = shop.nodes.map(function (item, index) {
        const def = N[item.type];
        const dept = D[def.dept];
        const bought = item.bought;
        const canBuy = !bought && s.money >= item.price;
        const name = tr(def.name);
        const desc = tr(def.desc);
        const deptName = tr(dept.name);
        return [
          '<div class="shop-offer' + (bought ? ' bought' : '') + '" style="' + deptStyle(def.dept) + '" data-tip="' + esc(t('shop.offerTip', { name: name, desc: desc, money: money(item.price) })) + '">',
          '  <span class="so-swatch"></span>',
          '  <span class="so-icon">' + esc(name.slice(0, 2)) + '</span>',
          '  <div class="so-main"><div class="so-name">' + esc(name) + ' <span class="dim">' + esc(deptName) + '</span></div><div class="so-desc">' + esc(desc) + '</div></div>',
          '  <div style="text-align:right"><div class="so-price">' + money(item.price) + '</div><button class="btn" data-action="shop-buy-node" data-index="' + index + '" ' + (!canBuy ? 'disabled' : '') + '>' + esc(bought ? t('shop.boughtNode') : t('shop.buy')) + '</button></div>',
          '</div>'
        ].join('');
      }).join('');
      const relic = shop.relic;
      const relicOwned = relic && s.relics.indexOf(relic.id) >= 0;
      const canBuyRelic = relic && !shop.relicBought && !relicOwned && s.money >= relic.price;
      const relicHtml = relic ? [
        '<div class="shop-relic">',
        '  <span class="so-icon" style="width:36px;height:36px;border-radius:8px;display:grid;place-items:center">' + esc(R[relic.id].icon) + '</span>',
        '  <div class="so-main"><div class="so-name">' + esc(tr(R[relic.id].name)) + '</div><div class="so-desc">' + esc(tr(R[relic.id].desc)) + '</div></div>',
        '  <div style="text-align:right"><div class="so-price">' + money(relic.price) + '</div><button class="btn" data-action="shop-buy-relic" ' + (!canBuyRelic ? 'disabled' : '') + '>' + esc(shop.relicBought ? t('shop.boughtRelic') : t('shop.buy')) + '</button></div>',
        '</div>'
      ].join('') : '<div class="muted-line">' + esc(t('shop.noRelic')) + '</div>';

      const handSet = new Set(s.hand.map(function (c) { return c.uid; }));
      const fieldSet = new Set();
      for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) if (s.grid[r][c]) fieldSet.add(s.grid[r][c].uid);
      const deckRows = s.deck.map(function (card) {
        const def = N[card.type];
        const owner = handSet.has(card.uid) ? t('deck.ownerHand') : fieldSet.has(card.uid) ? t('deck.ownerField') : '';
        const deleteDisabled = shop.deleteUsed || s.deck.length <= 1 || s.money < C.shop.deletePrice;
        const upgradeDisabled = shop.upgradeUsed || card.upgraded || s.money < C.shop.upgradePrice;
        return [
          '<div class="deck-row" style="' + deptStyle(def.dept) + '">',
          '  <span class="dr-swatch"></span>',
          '  <div class="dr-main"><div class="dr-name">' + esc(tr(def.name)) + ' <span class="dim">' + esc(tr(D[def.dept].name)) + '</span>' + (card.upgraded ? ' ★' : '') + '</div><div class="dr-meta">' + esc(tr(D[def.dept].name)) + ' · ' + timeLabel(approxHours(card)) + ' · ' + esc(def.output ? tr(P[def.output].name) : t('hand.multiOut')) + (def.dept === 'fx' ? ' · S' + card.substep : '') + (owner ? ' · ' + esc(owner) : '') + '</div></div>',
          '  <div class="dr-actions">',
          '    <button class="tiny-btn delete" data-action="shop-delete" data-uid="' + esc(card.uid) + '" ' + (deleteDisabled ? 'disabled' : '') + ' title="' + esc(t('shop.deleteTitle', { price: money(C.shop.deletePrice) })) + '">' + esc(t('shop.deleteBtn', { price: money(C.shop.deletePrice) })) + '</button>',
          '    <button class="tiny-btn upgrade" data-action="shop-upgrade" data-uid="' + esc(card.uid) + '" ' + (upgradeDisabled ? 'disabled' : '') + ' title="' + esc(t('shop.upgradeTitle', { price: money(C.shop.upgradePrice) })) + '">' + esc(t('shop.upgradeBtn', { price: money(C.shop.upgradePrice) })) + '</button>',
          '  </div>',
          '</div>'
        ].join('');
      }).join('');
      const nextIndex = s.levelIndex + 1;
      let nextText = t('shop.lastCompany');
      if (nextIndex < s.levels.length) {
        const nl = s.levels[nextIndex];
        nextText = t('shop.next', { month: nl.month, slot: nl.slot, tier: tierName(nl.tier) });
        if (nl.month !== lv.month) nextText += t('shop.nextRent', { money: money(game.currentRent()) });
      }
      const summary = ll
        ? (ll.success ? t('shop.summarySuccess', { money: money(ll.reward + (ll.portfolioBonus || 0)) }) : t('shop.summaryFail')) + ' · ' + t('shop.summaryScore', { score: ll.score, target: ll.target })
        : t('shop.summaryDefault');
      return [
        '<div class="backdrop"><div class="modal shop-modal">',
        '  <div class="modal-head"><div><div class="modal-kicker">' + esc(t('shop.kicker')) + '</div><div class="modal-title">' + esc(t('shop.title', { company: tr(lv.companyName) })) + '</div><div class="modal-sub">' + esc(summary) + '</div></div></div>',
        '  <div class="modal-body">',
        '    <div class="shop-topline"><div><span class="panel-kicker">' + esc(t('shop.wallet')) + '</span><div class="shop-money">' + money(s.money) + ' <small>' + esc(t('shop.cash')) + '</small></div></div><div class="muted-line" style="text-align:right">' + t('shop.note') + '</div></div>',
        '    <div class="shop-columns">',
        '      <div>',
        '        <div class="shop-section-title">' + esc(t('shop.nodesTitle')) + '</div>',
        '        <div class="shop-offers">' + offers + '</div>',
        '        <div class="shop-section-title" style="margin-top:18px">' + esc(t('shop.relicTitle')) + '</div>',
        relicHtml,
        '        <div class="shop-section-title" style="margin-top:18px">' + esc(t('shop.servicesTitle')) + '</div>',
        '        <div class="shop-services"><span class="service-pill ' + (shop.deleteUsed ? 'dim' : '') + '">' + esc(t('shop.deleteService')) + ' <b>' + money(C.shop.deletePrice) + '</b> ' + esc(shop.deleteUsed ? t('shop.used') : t('shop.unused')) + '</span><span class="service-pill ' + (shop.upgradeUsed ? 'dim' : '') + '">' + esc(t('shop.upgradeService')) + ' <b>' + money(C.shop.upgradePrice) + '</b> ' + esc(shop.upgradeUsed ? t('shop.used') : t('shop.unused')) + '</span></div>',
        '        <div class="muted-line" style="margin-top:7px">' + esc(t('shop.serviceNote')) + '</div>',
        '      </div>',
        '      <div>',
        '        <div class="shop-section-title">' + esc(t('shop.deckTitle', { n: s.deck.length })) + '</div>',
        '        <div class="deck-box"><div class="deck-list">' + deckRows + '</div></div>',
        '        <div class="shop-legend"><span>' + esc(t('shop.legend1')) + '</span><span>' + esc(t('shop.legend2')) + '</span></div>',
        '      </div>',
        '    </div>',
        '    <div class="shop-footer"><div class="shop-next">' + esc(nextText) + '</div><button class="btn primary" data-action="shop-leave">' + esc(t('shop.leave')) + '</button></div>',
        '  </div>',
        '</div></div>'
      ].join('');
    }

    function renderEndOverlay() {
      const s = game.state;
      const kind = s.status;
      let mark = '✕';
      let title = t('end.deadTitle');
      let titleClass = 'dead';
      let copy = t(s.endedReason || 'end.broke');
      let letter = '';
      if (kind === 'victory') {
        mark = '★';
        title = t('end.victoryTitle');
        titleClass = 'victory';
        const finalCompany = game.level ? tr(game.level.companyName) : t('end.dreamCompany');
        copy = t('end.victoryCopy', { company: finalCompany });
        letter = [
          '<div class="letter"><h3>' + esc(t('end.letterTitle')) + '</h3>',
          '<p>' + esc(t('end.letterGreeting')) + '</p>',
          '<p>' + esc(t('end.letterBody', { company: finalCompany })) + '</p>',
          '<p>' + esc(t('end.letterSalary')) + '</p>',
          '<div class="sig">' + esc(t('end.letterSig', { company: finalCompany })) + '</div>',
          '</div>'
        ].join('');
      } else if (kind === 'no_offer') {
        mark = '…';
        title = t('end.noOfferTitle');
        titleClass = 'miss';
        copy = t('end.noOfferCopy');
      } else {
        title = t('end.deadTitle');
        copy = t(s.endedReason || 'end.broke');
      }
      return [
        '<div class="backdrop"><div class="modal end-modal">',
        '  <div class="modal-body">',
        '    <div class="end-mark" style="color:' + (kind === 'victory' ? 'var(--accent)' : kind === 'dead' ? 'var(--bad)' : '#d9b88d') + '">' + mark + '</div>',
        '    <div class="end-title ' + titleClass + '">' + esc(title) + '</div>',
        '    <div class="end-copy">' + esc(copy) + '</div>',
        letter,
        '    <div class="end-stats"><div class="end-stat"><small>' + esc(t('end.finalMoney')) + '</small><b style="color:' + (s.money < 0 ? 'var(--bad)' : 'var(--good)') + '">' + money(s.money) + '</b></div><div class="end-stat"><small>' + esc(t('end.monthReached')) + '</small><b>' + esc(t('end.monthValue', { n: s.month })) + '</b></div><div class="end-stat"><small>' + esc(t('end.levelsCleared')) + '</small><b>' + s.levels.filter(function (l) { return l.clear; }).length + ' / 18</b></div></div>',
        '    <button class="btn primary" data-action="restart">' + esc(t('end.restart')) + '</button>',
        '  </div>',
        '</div></div>'
      ].join('');
    }

    function renderOverlay() {
      const s = game.state;
      let html = '';
      if (s.status === 'dead' || s.status === 'victory' || s.status === 'no_offer') {
        html = renderEndOverlay();
      } else if (s.phase === 'relic') {
        html = renderRelicOverlay();
      } else if (s.phase === 'shop') {
        html = renderShopOverlay();
      } else if (ui.modal === 'result' && ui.lastOutcome) {
        html = renderResultModal().html || '';
      } else if (ui.modal === 'deck') {
        html = renderDeckModal();
      } else if (ui.modal === 'help') {
        html = renderHelpModal();
      } else if (ui.modal === 'menu') {
        html = renderMenuModal();
      } else if (ui.modal === 'relics') {
        html = renderRelicsModal();
      } else if (ui.modal === 'cardinfo') {
        html = renderCardInfoModal();
      } else if (ui.modal === 'bond') {
        html = renderBondModal();
      } else if (ui.modal === 'rule') {
        html = renderRuleModal();
      }
      overlayRoot.innerHTML = html;
    }

    /* ============================================================
     * 整体渲染
     * ============================================================ */
    function renderAll() {
      if (ui.selectedUid && !game.state.hand.some(function (c) { return c.uid === ui.selectedUid; })) {
        ui.selectedUid = null;
      }
      const preview = game.getPreview();
      ui.lastPreview = preview;
      if (isCompact() && ui.nodeDetail) {
        const d = ui.nodeDetail;
        if (!(game.state.grid[d.row] && game.state.grid[d.row][d.col])) ui.nodeDetail = null;
      }
      if (isLandscape()) {
        app.innerHTML = renderLandscape(preview);
        sizeLandscapeBoard();
      } else if (isNarrow()) {
        app.innerHTML = renderTopMobile() +
          '<main class="mobile-main">' +
          renderCompanyMobile(preview) +
          renderBoardMobile(preview) +
          renderEstimateBar(preview) +
          renderBondsMobile(preview) +
          renderNodeDetail(preview) +
          '</main>' +
          renderDockMobile(preview);
      } else {
        app.innerHTML = renderTop() +
          '<main class="layout">' +
          renderCompany(preview) +
          '<section class="center-col">' + renderBoard(preview) + renderHand() + '</section>' +
          renderSide(preview) +
          '</main>';
      }
      renderOverlay();
      requestAnimationFrame(function () {
        if (isLandscape()) sizeLandscapeBoard();
        if (ui.lastPreview) drawWires(ui.lastPreview);
      });
    }

    /* ============================================================
     * 交互
     * ============================================================ */
    function handleCook() {
      if (ui.busy) return;
      const outcome = game.cook();
      if (!outcome.ok) {
        showToast(t(outcome.reason), 'bad');
        return;
      }
      ui.busy = true;
      ui.lastOutcome = outcome;
      ui.modal = null;
      ui.nodeDetail = null;
      renderAll();
      requestAnimationFrame(function () {
        animateCook(outcome.result, function () {
          ui.busy = false;
          ui.modal = 'result';
          renderAll();
        });
      });
    }

    function continueResult() {
      const wasEnd = game.state.phase === 'levelEnd';
      ui.lastOutcome = null;
      ui.modal = null;
      ui.busy = false;
      if (wasEnd) {
        const cont = game.continueAfterLevel();
        if (!cont.ok) showToast(t(cont.reason), 'bad');
      }
      renderAll();
    }

    function restartGame() {
      game = new E.Game();
      window.__VFX_GAME__ = game;
      ui.selectedUid = null;
      ui.busy = false;
      ui.modal = null;
      ui.lastOutcome = null;
      ui.lastPreview = null;
      ui.companyOpen = false;
      ui.nodeDetail = null;
      ui.cardInfoUid = null;
      ui.bondId = null;
      ui.longPressed = false;
      renderAll();
    }

    function selectHand(uid) {
      if (!isPlaying()) return;
      ui.selectedUid = ui.selectedUid === uid ? null : uid;
      ui.nodeDetail = null;
      renderAll();
    }

    function placeOnCell(row, col) {
      if (!isPlaying()) return;
      if (!ui.selectedUid) {
        showToast(t('toast.pickHandFirst'), 'bad');
        return;
      }
      const res = game.placeCard(ui.selectedUid, row, col);
      if (!res.ok) {
        showToast(t(res.reason), 'bad');
        return;
      }
      ui.selectedUid = null;
      ui.nodeDetail = null;
      renderAll();
    }

    function removePlacedNode(row, col) {
      if (!isPlaying()) return;
      const res = game.removeCard(row, col);
      if (!res.ok) {
        showToast(t(res.reason), 'bad');
        return;
      }
      renderAll();
    }

    document.addEventListener('click', function (ev) {
      if (ui.busy) return;
      const actionEl = ev.target.closest('[data-action]');
      if (actionEl) {
        const action = actionEl.getAttribute('data-action');
        if (action === 'select-hand') {
          if (ui.longPressed) { ui.longPressed = false; ev.stopPropagation(); return; }
          selectHand(actionEl.getAttribute('data-uid'));
          ev.stopPropagation();
          return;
        }
        if (action === 'substep') {
          if (!isPlaying()) return;
          const uid = actionEl.getAttribute('data-uid');
          const delta = Number(actionEl.getAttribute('data-delta'));
          const res = game.setSubstep(uid, delta, true);
          if (!res.ok) showToast(t(res.reason), 'bad');
          renderAll();
          ev.stopPropagation();
          return;
        }
        if (action === 'vex') {
          if (!isPlaying()) return;
          const res = game.markVex(actionEl.getAttribute('data-uid'));
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.vexMarked'), 'good');
          renderAll();
          ev.stopPropagation();
          return;
        }
        if (action === 'lang') {
          lang = lang === 'en' ? 'zh' : 'en';
          saveLang(lang);
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
          document.title = t('app.title');
          tooltip.classList.remove('show');
          renderAll();
          return;
        }
        if (action === 'help') {
          if (ui.busy) return;
          ui.modal = 'help';
          renderOverlay();
          return;
        }
        if (action === 'deck') {
          if (ui.busy) return;
          ui.modal = 'deck';
          renderOverlay();
          return;
        }
        if (action === 'menu') {
          if (ui.busy) return;
          ui.modal = 'menu';
          renderOverlay();
          return;
        }
        if (action === 'relics') {
          if (ui.busy) return;
          ui.modal = 'relics';
          renderOverlay();
          return;
        }
        if (action === 'card-info') {
          if (ui.busy) return;
          ui.modal = 'cardinfo';
          ui.cardInfoUid = actionEl.getAttribute('data-uid');
          renderOverlay();
          return;
        }
        if (action === 'bond-info') {
          if (ui.busy) return;
          ui.bondId = actionEl.getAttribute('data-bond');
          ui.modal = 'bond';
          renderOverlay();
          return;
        }
        if (action === 'rule-info') {
          if (ui.busy) return;
          ui.modal = 'rule';
          renderOverlay();
          return;
        }
        if (action === 'company-toggle') {
          ui.companyOpen = !ui.companyOpen;
          renderAll();
          return;
        }
        if (action === 'node-detail-close') {
          ui.nodeDetail = null;
          renderAll();
          return;
        }
        if (action === 'node-detail-remove') {
          if (!ui.nodeDetail || !isPlaying()) return;
          const res = game.removeCard(ui.nodeDetail.row, ui.nodeDetail.col);
          if (!res.ok) showToast(t(res.reason), 'bad');
          ui.nodeDetail = null;
          renderAll();
          return;
        }
        if (action === 'close-modal') {
          ui.modal = null;
          renderOverlay();
          return;
        }
        if (action === 'cook') {
          handleCook();
          return;
        }
        if (action === 'result-continue') {
          continueResult();
          return;
        }
        if (action === 'shop-buy-node') {
          const res = game.buyShopNode(Number(actionEl.getAttribute('data-index')));
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.boughtNode', { name: tr(N[res.card.type].name) }), 'good');
          renderAll();
          return;
        }
        if (action === 'shop-buy-relic') {
          const res = game.buyShopRelic();
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.gotRelic', { name: tr(res.relic.name) }), 'good');
          renderAll();
          return;
        }
        if (action === 'shop-delete') {
          const card = game.cardByUid(actionEl.getAttribute('data-uid'));
          if (!card) return;
          const res = game.buyDelete(card.uid);
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.deleted', { name: tr(N[card.type].name) }), 'good');
          renderAll();
          return;
        }
        if (action === 'shop-upgrade') {
          const res = game.buyUpgrade(actionEl.getAttribute('data-uid'));
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.upgraded', { mult: C.upgradeMultiplier }), 'good');
          renderAll();
          return;
        }
        if (action === 'shop-leave') {
          const res = game.leaveShop();
          if (!res.ok) showToast(t(res.reason), 'bad');
          if (res.ended && res.dead) showToast(t('toast.rentDead'), 'bad');
          renderAll();
          return;
        }
        if (action === 'choose-relic') {
          const res = game.chooseRelic(actionEl.getAttribute('data-id'));
          if (!res.ok) showToast(t(res.reason), 'bad');
          else showToast(t('toast.relicPicked', { name: tr(res.relic.name) }), 'good');
          renderAll();
          return;
        }
        if (action === 'restart') {
          restartGame();
          return;
        }
        return;
      }

      const nodeEl = ev.target.closest('.node');
      if (nodeEl) {
        const row = Number(nodeEl.getAttribute('data-row'));
        const col = Number(nodeEl.getAttribute('data-col'));
        if (isCompact()) {
          ui.selectedUid = null;
          ui.nodeDetail = { row: row, col: col };
          renderAll();
        } else {
          removePlacedNode(row, col);
        }
        return;
      }
      const cellEl = ev.target.closest('.cell.empty');
      if (cellEl) {
        placeOnCell(Number(cellEl.getAttribute('data-row')), Number(cellEl.getAttribute('data-col')));
        return;
      }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !ui.busy) {
        if (['deck', 'help', 'menu', 'relics', 'cardinfo', 'bond', 'rule'].indexOf(ui.modal) >= 0) {
          ui.modal = null;
          ui.cardInfoUid = null;
          renderOverlay();
        } else if (isCompact() && ui.nodeDetail) {
          ui.nodeDetail = null;
          renderAll();
        }
      }
    });

    /* 长按手牌查看说明（触屏） */
    let longPressTimer = null;
    function cancelLongPress() {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
    document.addEventListener('pointerdown', function (ev) {
      if (!isCompact() || ui.busy) return;
      const cardEl = ev.target.closest('.hand-card');
      if (!cardEl || ev.target.closest('.hc-info')) return;
      ui.longPressed = false;
      const uid = cardEl.getAttribute('data-uid');
      cancelLongPress();
      longPressTimer = setTimeout(function () {
        longPressTimer = null;
        ui.longPressed = true;
        ui.modal = 'cardinfo';
        ui.cardInfoUid = uid;
        renderOverlay();
      }, 500);
    });
    ['pointerup', 'pointercancel', 'pointermove'].forEach(function (name) {
      document.addEventListener(name, cancelLongPress, { passive: true });
    });
    document.addEventListener('contextmenu', function (ev) {
      if (isCompact() && ev.target.closest('.hand-card')) ev.preventDefault();
    });

    window.addEventListener('resize', function () {
      if (isLandscape()) sizeLandscapeBoard();
      if (ui.lastPreview) drawWires(ui.lastPreview);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        if (isLandscape()) sizeLandscapeBoard();
        if (ui.lastPreview) drawWires(ui.lastPreview);
      }, 220);
    });
    function onBreakpointChange() {
      ui.nodeDetail = null;
      ui.longPressed = false;
      renderAll();
    }
    if (narrowMedia.addEventListener) narrowMedia.addEventListener('change', onBreakpointChange);
    else if (narrowMedia.addListener) narrowMedia.addListener(onBreakpointChange);
    if (landscapeMedia.addEventListener) landscapeMedia.addEventListener('change', onBreakpointChange);
    else if (landscapeMedia.addListener) landscapeMedia.addListener(onBreakpointChange);

    /* ============================================================
     * Tooltip
     * ============================================================ */
    document.addEventListener('mouseover', function (ev) {
      const tipEl = ev.target.closest('[data-tip]');
      if (!tipEl) {
        tooltip.classList.remove('show');
        return;
      }
      tooltip.textContent = tipEl.getAttribute('data-tip');
      tooltip.classList.add('show');
      positionTooltip(ev);
    });
    document.addEventListener('mousemove', function (ev) {
      if (tooltip.classList.contains('show')) positionTooltip(ev);
    });
    document.documentElement.addEventListener('mouseleave', function () {
      tooltip.classList.remove('show');
    });
    function positionTooltip(ev) {
      const pad = 15;
      const r = tooltip.getBoundingClientRect();
      let x = ev.clientX + pad;
      let y = ev.clientY + pad;
      if (x + r.width > window.innerWidth - 10) x = ev.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 10) y = ev.clientY - r.height - pad;
      tooltip.style.left = Math.max(8, x) + 'px';
      tooltip.style.top = Math.max(8, y) + 'px';
    }

    /* ============================================================
     * 启动
     * ============================================================ */
    renderAll();
  })();
  </script>
</body>
</html>
