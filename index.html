<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Node Rogue</title>
<style>
  :root {
    --bg: #0a0d12;
    --bg-2: #0e131a;
    --panel: #151b24;
    --panel-2: #1b222d;
    --panel-3: #222b38;
    --line: #2b3645;
    --line-soft: #202936;
    --text: #e8edf5;
    --muted: #8996a8;
    --muted-2: #647184;
    --accent: #ffd166;
    --accent-2: #ffb84d;
    --good: #55d6a0;
    --bad: #ff6471;
    --warn: #ffab5c;
    --model: #7f8997;
    --fx: #e97932;
    --lighting: #337fd6;
    --comp: #9561dc;
    --merge: #e8e8e8;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1000px 600px at 50% -150px, rgba(58, 95, 150, .20), transparent 65%),
      radial-gradient(800px 500px at 96% 20%, rgba(149, 97, 220, .09), transparent 60%),
      radial-gradient(700px 500px at 2% 70%, rgba(233, 121, 50, .055), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    min-width: 1120px;
    overflow-x: auto;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
    z-index: -1;
  }
  button { font: inherit; color: inherit; }
  button:disabled { cursor: not-allowed; }
  ::selection { background: rgba(255,209,102,.3); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #394657; border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .app { max-width: 1320px; margin: 0 auto; padding: 14px 18px 28px; }

  /* ===== top bar ===== */
  .topbar {
    display: grid;
    grid-template-columns: 246px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 10px 14px;
    margin-bottom: 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(27,35,47,.96), rgba(18,24,33,.96));
    box-shadow: 0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.045);
    position: relative;
    z-index: 4;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-mark {
    width: 39px; height: 39px; flex: 0 0 auto;
    display: grid; place-items: center;
    color: #151a21; font-size: 19px; font-weight: 900;
    background: linear-gradient(135deg, #ffe39b, #ffb84d);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    box-shadow: 0 0 24px rgba(255,193,84,.3);
  }
  .brand-title {
    font-size: 15px; font-weight: 900; letter-spacing: .13em; line-height: 1.1;
    white-space: nowrap;
  }
  .brand-sub { color: var(--muted); font-size: 10px; letter-spacing: .08em; margin-top: 4px; }
  .top-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(100px, 1fr)) auto;
    align-items: stretch;
    gap: 8px;
    min-width: 0;
  }
  .stat {
    padding: 6px 11px;
    border-radius: 9px;
    border: 1px solid var(--line-soft);
    background: rgba(9,13,18,.35);
    min-width: 0;
  }
  .stat small {
    display: block; font-size: 9.5px; letter-spacing: .10em;
    color: var(--muted-2); text-transform: uppercase; margin-bottom: 2px;
    white-space: nowrap;
  }
  .stat b {
    display: block; font-size: 13px; font-weight: 750;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .stat.money b { color: var(--good); }
  .stat.rent b { color: var(--warn); }
  .relic-strip {
    display: flex; align-items: center; gap: 5px;
    padding-left: 5px; min-width: 74px;
  }
  .relic-icon {
    width: 29px; height: 29px; display: grid; place-items: center;
    border-radius: 8px; border: 1px solid rgba(255,209,102,.28);
    background: linear-gradient(160deg, rgba(255,209,102,.16), rgba(255,209,102,.04));
    color: var(--accent); font-size: 10px; font-weight: 800;
    cursor: help; letter-spacing: -.03em;
  }
  .relic-icon.empty {
    border-color: var(--line); color: var(--muted-2);
    background: rgba(9,13,18,.35); cursor: default; font-size: 11px;
  }
  .top-actions { display: flex; align-items: center; gap: 7px; }
  .icon-btn {
    height: 32px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,.035);
    color: var(--muted); cursor: pointer; transition: .15s ease;
    font-size: 11px; font-weight: 650; white-space: nowrap;
  }
  .icon-btn:hover { color: var(--text); border-color: #45536a; background: rgba(255,255,255,.065); }

  /* ===== layout ===== */
  .layout {
    display: grid;
    grid-template-columns: 250px minmax(620px, 1fr) 282px;
    gap: 14px;
    align-items: start;
  }
  .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(24,31,42,.95), rgba(17,22,30,.96));
    box-shadow: 0 10px 25px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.035);
  }
  .panel-label {
    font-size: 9px; letter-spacing: .18em; color: var(--muted-2);
    font-weight: 800; text-transform: uppercase;
  }
  .center-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .side-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  /* ===== company ===== */
  .company-panel { padding: 16px; position: relative; overflow: hidden; }
  .company-panel::after {
    content: ""; position: absolute; width: 150px; height: 150px; right: -70px; top: -80px;
    border-radius: 50%; background: radial-gradient(circle, var(--dept, rgba(255,209,102,.3)), transparent 70%);
    opacity: .18; pointer-events: none;
  }
  .company-topline { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tier-badge {
    font-size: 9px; letter-spacing: .12em; font-weight: 800;
    padding: 3px 7px; border-radius: 999px; border: 1px solid #3d4b5e;
    color: var(--muted); white-space: nowrap;
  }
  .tier-badge.boss { color: var(--accent); border-color: rgba(255,209,102,.4); background: rgba(255,209,102,.08); }
  .tier-badge.mid { color: #8ec5ff; border-color: rgba(77,157,255,.35); background: rgba(77,157,255,.08); }
  .company-name {
    margin: 15px 0 3px; font-size: 22px; line-height: 1.15; letter-spacing: -.02em;
    font-weight: 850; color: #f4f7fb;
  }
  .company-sub { color: var(--muted); font-size: 11px; min-height: 16px; }
  .job-requirement {
    margin: 14px 0 12px; padding: 12px;
    border-radius: 11px; border: 1px solid var(--line);
    background: rgba(7,10,14,.36);
  }
  .job-req-label { color: var(--muted-2); font-size: 9px; letter-spacing: .14em; font-weight: 800; }
  .job-req-main { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
  .target-port-large {
    width: 33px; height: 33px; flex: 0 0 auto;
    display: inline-block;
  }
  .job-req-main strong { font-size: 16px; font-weight: 800; }
  .job-req-main strong small { color: var(--muted); font-size: 10px; font-weight: 500; margin-left: 5px; }
  .job-numbers {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 11px;
  }
  .job-number { padding-top: 8px; border-top: 1px solid var(--line-soft); }
  .job-number small { display: block; font-size: 9.5px; color: var(--muted-2); letter-spacing: .08em; }
  .job-number b { font-size: 15px; font-variant-numeric: tabular-nums; color: #f4f7fb; }
  .rule-box {
    padding: 10px 10px 9px; border-radius: 10px;
    background: rgba(255,171,92,.055); border: 1px solid rgba(255,171,92,.16);
  }
  .rule-box .rule-name { color: var(--warn); font-size: 11px; font-weight: 800; margin-bottom: 3px; }
  .rule-box .rule-desc { color: #b7bdc8; font-size: 10.5px; line-height: 1.5; }
  .company-foot {
    margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line-soft);
    color: var(--muted); font-size: 10px; display: flex; justify-content: space-between; gap: 8px;
  }
  .company-foot b { color: #d9e0ea; }

  /* ===== board ===== */
  .board-panel { padding: 12px; overflow: visible; }
  .board-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 3px 10px; color: var(--muted-2); font-size: 9.5px; letter-spacing: .12em;
    font-weight: 700;
  }
  .board-head strong { color: var(--muted); font-weight: 700; letter-spacing: .08em; }
  .flow-hint { display: flex; align-items: center; gap: 5px; }
  .flow-hint i {
    width: 34px; height: 1px; background: linear-gradient(90deg, transparent, #607089);
    display: inline-block; position: relative;
  }
  .flow-hint i::after {
    content: ""; position: absolute; right: -1px; top: -2px;
    border-left: 4px solid #607089; border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }
  .board-shell { position: relative; padding: 9px; border-radius: 12px; background: rgba(5,8,12,.45); border: 1px solid var(--line-soft); }
  #wire-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; overflow: visible; }
  .board {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: repeat(6, 82px) 72px;
    grid-auto-rows: 90px;
    gap: 10px;
    width: 624px;
    margin: 0 auto;
  }
  .cell, .node, .out-slot {
    width: 100%; height: 100%; border-radius: 10px;
  }
  .cell {
    position: relative; border: 1px dashed #293443;
    background:
      linear-gradient(135deg, rgba(255,255,255,.012), transparent 55%),
      rgba(255,255,255,.012);
    cursor: default; color: #344050;
    display: grid; place-items: center;
    transition: .14s ease;
  }
  .cell.empty { cursor: pointer; }
  .cell.empty:hover {
    border-color: #40526a; background: rgba(255,255,255,.035); color: #4d5e74;
  }
  .cell .cell-plus { font-size: 15px; opacity: 0; transition: .15s; }
  .cell.drop-ready { border-color: rgba(85,214,160,.48); background: rgba(85,214,160,.045); }
  .cell.drop-ready .cell-plus { opacity: 1; color: rgba(85,214,160,.8); }
  .cell .cell-coord { position: absolute; left: 5px; top: 4px; font-size: 7px; color: #2e3948; letter-spacing: .05em; }
  .node {
    --dept-color: #7f8997;
    position: relative; overflow: hidden;
    padding: 6px 6px 5px;
    border: 1px solid color-mix(in srgb, var(--dept-color) 55%, #ffffff 8%);
    background:
      linear-gradient(155deg, color-mix(in srgb, var(--dept-color) 72%, #0d1117), color-mix(in srgb, var(--dept-color) 34%, #0c1016));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 5px 13px rgba(0,0,0,.24);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    color: #fff;
  }
  .node:hover {
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 8px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.18);
    z-index: 6;
  }
  .node.dept-model { --dept-color: var(--model); color: #f5f7fa; }
  .node.dept-fx { --dept-color: var(--fx); color: #fff8f2; }
  .node.dept-lighting { --dept-color: var(--lighting); color: #f3f9ff; }
  .node.dept-comp { --dept-color: var(--comp); color: #fbf8ff; }
  .node.dept-merge { --dept-color: var(--merge); color: #161b22; }
  .node.disconnected { opacity: .46; filter: saturate(.45); }
  .node.pass-through { outline: 1px dashed rgba(255,255,255,.45); outline-offset: -4px; }
  .node::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.10), transparent 35%);
  }
  .node-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 3px; position: relative; z-index: 1; }
  .node-name { font-size: 10px; line-height: 1.05; font-weight: 850; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-cn { font-size: 6.8px; opacity: .65; white-space: nowrap; margin-left: 2px; }
  .node-mid { display: flex; align-items: baseline; justify-content: space-between; gap: 3px; margin-top: 4px; position: relative; z-index: 1; }
  .node-value { font-size: 17px; line-height: 1; font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: -.04em; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .node-value.empty-value { opacity: .5; font-size: 13px; }
  .node-hours { font-size: 8px; font-weight: 700; opacity: .78; white-space: nowrap; }
  .node-foot { display: flex; align-items: center; justify-content: space-between; gap: 2px; margin-top: 5px; position: relative; z-index: 1; }
  .ports { display: inline-flex; align-items: center; gap: 2px; }
  .arrow { opacity: .55; font-size: 8px; line-height: 1; }
  .node .port { width: 6px; height: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .node .port.out { width: 7px; height: 7px; }
  .node-corner {
    position: absolute; right: 4px; top: 4px; z-index: 3;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .badge-mini {
    font-size: 7px; line-height: 1; padding: 2px 3px; border-radius: 3px;
    background: rgba(6,9,13,.38); border: 1px solid rgba(255,255,255,.18);
    font-weight: 800; letter-spacing: .03em;
  }
  .badge-mini.vex { color: #c5ffdf; border-color: rgba(85,214,160,.42); background: rgba(16,54,39,.65); }
  .badge-mini.risk { color: #ffd0d2; border-color: rgba(255,100,113,.4); background: rgba(65,18,24,.6); }
  .badge-mini.star { color: var(--accent); border-color: rgba(255,209,102,.35); background: rgba(62,45,13,.65); }
  .node-stepper {
    display: inline-flex; align-items: center; gap: 1px;
    background: rgba(4,7,10,.32); border: 1px solid rgba(255,255,255,.16);
    border-radius: 4px; padding: 1px;
  }
  .node-stepper span { font-size: 8px; font-weight: 800; min-width: 14px; text-align: center; }
  .node-stepper button {
    border: 0; background: transparent; color: inherit; cursor: pointer;
    font-size: 10px; line-height: 1; width: 13px; height: 12px; padding: 0;
    border-radius: 2px; font-weight: 900; opacity: .85;
  }
  .node-stepper button:hover { background: rgba(255,255,255,.16); }
  .node-stepper button:disabled { opacity: .25; }
  .vex-btn {
    border: 1px solid rgba(85,214,160,.5); background: rgba(6,18,13,.36);
    color: #c7ffe4; font-size: 8px; font-weight: 850; letter-spacing: .04em;
    border-radius: 3px; padding: 2px 3px; cursor: pointer; line-height: 1;
  }
  .vex-btn:hover { background: rgba(37,101,73,.55); }
  .node.rescued { box-shadow: 0 0 0 2px rgba(85,214,160,.65), 0 0 20px rgba(85,214,160,.25); }
  .node.exploded { background: linear-gradient(155deg, #5d2028, #2a1015) !important; border-color: #ff6471; }
  .node.pass-through .node-name::after { content: " ↦"; opacity: .7; }
  .node.cooking-dead { opacity: .38; filter: grayscale(.7); }
  .node.boom-anim { animation: boom .55s ease both; }
  .node.pop-anim .node-value { animation: valuePop .32s ease both; }
  .node.aura-target { box-shadow: 0 0 0 1px rgba(77,157,255,.55), 0 0 18px rgba(77,157,255,.2); }
  .node .aura-tag { position: absolute; left: 4px; bottom: 17px; font-size: 6.5px; color: #b7ddff; opacity: .9; }
  .node .rescue-tag { position: absolute; left: 4px; bottom: 17px; font-size: 6.5px; color: #b9ffe0; }

  /* output slot */
  .out-slot {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    padding: 7px 6px 6px; border: 1px solid rgba(255,209,102,.24);
    background: linear-gradient(155deg, rgba(255,209,102,.08), rgba(8,11,16,.55));
    cursor: default; overflow: hidden;
  }
  .out-slot::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,255,255,.018) 9px 10px);
    pointer-events: none;
  }
  .out-slot .out-top { font-size: 7.5px; letter-spacing: .16em; color: rgba(255,209,102,.65); font-weight: 850; }
  .out-slot .out-mid { display: flex; align-items: center; justify-content: space-between; gap: 3px; position: relative; z-index: 1; }
  .out-slot .out-value { font-size: 17px; font-weight: 850; font-variant-numeric: tabular-nums; color: var(--accent); letter-spacing: -.04em; }
  .out-slot .out-value.muted { color: #6a7585; }
  .out-slot .out-type { font-size: 8px; color: var(--muted); position: relative; z-index: 1; }
  .out-slot.match { border-color: rgba(255,209,102,.55); box-shadow: inset 0 0 16px rgba(255,209,102,.08); }
  .out-slot.mismatch { border-color: rgba(255,100,113,.24); background: linear-gradient(155deg, rgba(255,100,113,.05), rgba(8,11,16,.55)); }
  .out-slot.empty-out { border-style: dashed; opacity: .7; }
  .target-port-large, .port { display: inline-block; flex: 0 0 auto; }
  .port { width: 8px; height: 8px; background: currentColor; color: var(--port-color, #9aa4b3); }
  .port.geo { --port-color: #9aa4b3; border-radius: 1px; }
  .port.sim { --port-color: #ff9349; clip-path: polygon(50% 2%, 100% 98%, 0 98%); }
  .port.render { --port-color: #4d9dff; border-radius: 50%; }
  .port.final { --port-color: #ffd166; transform: rotate(45deg); border-radius: 1px; }
  .target-port-large.geo { color: #9aa4b3; background: currentColor; border-radius: 3px; }
  .target-port-large.sim { color: #ff9349; background: currentColor; clip-path: polygon(50% 2%, 100% 98%, 0 98%); }
  .target-port-large.render { color: #4d9dff; background: currentColor; border-radius: 50%; }
  .target-port-large.final { color: #ffd166; background: currentColor; transform: rotate(45deg); border-radius: 3px; }

  /* ===== hand ===== */
  .hand-panel { padding: 10px 12px 12px; }
  .hand-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 1px 2px 8px; }
  .hand-head strong { font-size: 11px; letter-spacing: .08em; color: #d5dce7; }
  .hand-head span { font-size: 9.5px; color: var(--muted-2); }
  .hand-list { display: flex; gap: 7px; justify-content: center; min-height: 106px; }
  .hand-card {
    --dept-color: #7f8997;
    width: 74px; height: 106px; flex: 0 0 74px;
    position: relative; overflow: hidden; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--dept-color) 52%, #ffffff 8%);
    border-radius: 9px; padding: 6px 6px 5px;
    background: linear-gradient(155deg, color-mix(in srgb, var(--dept-color) 68%, #0b0f14), color-mix(in srgb, var(--dept-color) 28%, #0b0f14));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 5px 12px rgba(0,0,0,.2);
    transition: .14s ease; color: #fff;
  }
  .hand-card.dept-merge { color: #14181f; }
  .hand-card:hover { transform: translateY(-3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 22px rgba(0,0,0,.32); }
  .hand-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,209,102,.66), 0 10px 22px rgba(0,0,0,.32);
    transform: translateY(-3px);
  }
  .hand-card.vexed { box-shadow: 0 0 0 2px rgba(85,214,160,.65), 0 10px 22px rgba(0,0,0,.32); }
  .hand-card .hc-top { display: flex; justify-content: space-between; gap: 2px; position: relative; z-index: 1; }
  .hand-card .hc-name { font-size: 9.5px; font-weight: 850; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hand-card .hc-cn { font-size: 7px; opacity: .62; margin-top: 2px; }
  .hand-card .hc-op { margin-top: 8px; font-size: 13px; font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
  .hand-card .hc-op small { font-size: 7px; font-weight: 600; opacity: .7; margin-left: 2px; }
  .hand-card .hc-meta { margin-top: 5px; font-size: 7.5px; opacity: .78; position: relative; z-index: 1; }
  .hand-card .hc-portline { display: flex; align-items: center; gap: 2px; margin-top: 5px; position: relative; z-index: 1; }
  .hand-card .hc-bottom {
    position: absolute; left: 6px; right: 6px; bottom: 5px; display: flex; justify-content: space-between; align-items: flex-end; gap: 2px;
    z-index: 2;
  }
  .hand-card .node-stepper { background: rgba(4,7,10,.3); }
  .hand-card .vex-btn { margin-left: auto; }
  .hand-card .hc-star { color: var(--accent); font-size: 9px; text-shadow: 0 0 6px rgba(255,209,102,.5); }
  .hand-card.dept-fx .hc-op { color: #ffe6d2; }
  .hand-card.dept-lighting .hc-op { color: #dceeff; }
  .hand-card.dept-comp .hc-op { color: #f1e4ff; }
  .hand-empty {
    flex: 1; min-height: 106px; border: 1px dashed var(--line); border-radius: 9px;
    display: grid; place-items: center; color: var(--muted-2); font-size: 11px;
  }

  /* ===== side: score/bonds/cook ===== */
  .score-panel, .bonds-panel, .cook-panel { padding: 12px; }
  .panel-title-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 9px; }
  .panel-title { font-size: 10px; font-weight: 800; letter-spacing: .10em; color: #c6d0dd; }
  .panel-kicker { font-size: 8px; color: var(--muted-2); letter-spacing: .12em; }
  .score-line { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
  .score-now { font-size: 29px; line-height: .95; font-weight: 900; letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: var(--accent); }
  .score-target { color: var(--muted); font-size: 10px; padding-bottom: 3px; white-space: nowrap; }
  .score-target b { color: #d7e0ec; font-size: 14px; }
  .progress { height: 6px; border-radius: 10px; background: #0b1017; border: 1px solid #263140; overflow: hidden; margin-top: 9px; }
  .progress > i { display: block; height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, #e6a935, #ffd166); transition: width .22s ease; }
  .progress.good > i { background: linear-gradient(90deg, #36ad7d, #67e5b1); }
  .progress.bad > i { background: linear-gradient(90deg, #b43b4c, #ff6471); }
  .score-rows { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .score-row { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--muted); }
  .score-row .sr-tag { width: 17px; color: var(--muted-2); font-weight: 700; font-size: 8px; }
  .score-row .sr-type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score-row .sr-val { font-variant-numeric: tabular-nums; color: #d4dce7; font-weight: 700; }
  .score-row.ok .sr-val { color: var(--accent); }
  .score-row.bad .sr-val { color: var(--bad); }
  .score-row .sr-check { width: 11px; font-size: 9px; color: var(--good); }
  .score-row.bad .sr-check { color: var(--bad); }
  .muted-line { color: var(--muted); font-size: 9.5px; line-height: 1.5; }
  .special-note {
    margin-top: 9px; padding: 7px 8px; border-radius: 7px; font-size: 9px; line-height: 1.45;
    border: 1px solid rgba(77,157,255,.22); color: #a8cfff; background: rgba(77,157,255,.06);
  }
  .special-note.warn { border-color: rgba(255,171,92,.25); color: #ffd09a; background: rgba(255,171,92,.06); }

  .bond-list { display: flex; flex-direction: column; gap: 5px; }
  .bond {
    display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 7px;
    padding: 6px 7px; border-radius: 7px; border: 1px solid transparent;
    background: rgba(255,255,255,.022); font-size: 9.5px; color: var(--muted);
  }
  .bond .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bond-color); opacity: .5; }
  .bond .b-name { color: #b9c4d2; font-weight: 700; }
  .bond .b-eff { display: block; font-size: 8px; color: var(--muted-2); margin-top: 1px; }
  .bond .b-count { font-size: 9px; font-variant-numeric: tabular-nums; color: var(--muted-2); }
  .bond.active {
    border-color: color-mix(in srgb, var(--bond-color) 38%, transparent);
    background: color-mix(in srgb, var(--bond-color) 9%, transparent);
  }
  .bond.active .dot { opacity: 1; box-shadow: 0 0 8px var(--bond-color); }
  .bond.active .b-name { color: #eef3f9; }
  .bond.active .b-count { color: var(--bond-color); font-weight: 800; }
  .bond.model { --bond-color: var(--model); }
  .bond.fx { --bond-color: var(--fx); }
  .bond.lighting { --bond-color: var(--lighting); }
  .bond.comp { --bond-color: var(--comp); }

  .budget-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .budget-number { font-size: 18px; font-weight: 850; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .budget-number small { font-size: 10px; color: var(--muted); font-weight: 500; }
  .budget-number.over { color: var(--bad); }
  .budget-label { color: var(--muted-2); font-size: 9px; letter-spacing: .08em; }
  .budget-bar { height: 8px; margin-top: 8px; border-radius: 10px; border: 1px solid #273243; background: #090d13; overflow: hidden; }
  .budget-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #356eaa, #62b1ff); transition: width .2s; }
  .budget-bar.warn > i { background: linear-gradient(90deg, #b07a2b, #ffbe62); }
  .budget-bar.over > i { background: linear-gradient(90deg, #a93845, #ff6471); }
  .cook-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; font-size: 9px; color: var(--muted); }
  .attempt-dots { display: flex; align-items: center; gap: 3px; }
  .attempt-dot { width: 6px; height: 6px; border-radius: 50%; background: #303b4b; border: 1px solid #3b4758; }
  .attempt-dot.used { background: #5b3d2a; border-color: #a66638; }
  .explode-risk { color: var(--muted-2); font-size: 8.5px; margin-top: 7px; }
  .explode-risk b { color: var(--warn); font-weight: 700; }
  .cook-btn {
    width: 100%; margin-top: 10px; border: 0; border-radius: 9px;
    min-height: 43px; cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #ffe19a, #ffc457);
    color: #241b08; font-weight: 950; letter-spacing: .12em; font-size: 14px;
    box-shadow: 0 5px 18px rgba(255,190,80,.20), inset 0 1px 0 rgba(255,255,255,.55);
    transition: .15s ease;
  }
  .cook-btn::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.3) 45%, transparent 60%);
    transform: translateX(-110%); transition: .5s ease;
  }
  .cook-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  .cook-btn:hover:not(:disabled)::after { transform: translateX(110%); }
  .cook-btn:active:not(:disabled) { transform: translateY(0); }
  .cook-btn:disabled {
    background: #252d38; color: #647184; box-shadow: none;
    border: 1px solid #303b4b;
  }
  .cook-sub { margin-top: 6px; text-align: center; font-size: 8.5px; color: var(--muted-2); min-height: 12px; }
  .cook-sub.bad { color: var(--bad); }
  .side-mini-actions { display: flex; gap: 5px; margin-top: 8px; }
  .side-mini-actions .icon-btn { flex: 1; height: 26px; font-size: 9.5px; padding: 0 5px; }

  /* ===== util ===== */
  .muted { color: var(--muted); }
  .dim { color: var(--muted-2); }
  .nowrap { white-space: nowrap; }
  .sep { height: 1px; background: var(--line-soft); margin: 10px 0; }
  .line-icon { width: 1px; height: 12px; background: var(--line); display: inline-block; margin: 0 2px; }

  /* ===== tooltip & toast ===== */
  #tooltip {
    position: fixed; z-index: 999; max-width: 310px; pointer-events: none;
    background: #080c12; border: 1px solid #3a475a; border-radius: 9px;
    box-shadow: 0 14px 42px rgba(0,0,0,.55); color: #cfd8e4;
    padding: 9px 11px; font-size: 10px; line-height: 1.55; white-space: pre-line;
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  #tooltip.show { opacity: 1; transform: translateY(0); }
  #tooltip b { color: #f1f5fa; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; z-index: 1000;
    transform: translate(-50%, 18px); opacity: 0; pointer-events: none;
    background: #171f2a; border: 1px solid #405069; color: #e7edf6;
    padding: 9px 15px; border-radius: 9px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
    font-size: 11px; transition: .2s ease; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: rgba(255,100,113,.45); color: #ffd8db; }
  #toast.good { border-color: rgba(85,214,160,.4); color: #d6ffec; }

  /* ===== overlays ===== */
  #overlay-root:empty { display: none; }
  .backdrop {
    position: fixed; inset: 0; z-index: 100; padding: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,10,.78); backdrop-filter: blur(7px);
    animation: fadeIn .16s ease both;
  }
  .modal {
    width: 100%; max-width: 580px; max-height: calc(100vh - 44px); overflow: auto;
    border: 1px solid #344255; border-radius: 16px;
    background: linear-gradient(180deg, #1a2230, #111820);
    box-shadow: 0 30px 100px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    animation: modalIn .2s ease both; position: relative;
  }
  .modal.wide { max-width: 830px; }
  .modal.shop-modal { max-width: 1080px; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 19px 20px 13px; border-bottom: 1px solid var(--line-soft); }
  .modal-title { font-size: 19px; font-weight: 850; letter-spacing: -.02em; }
  .modal-kicker { color: var(--muted-2); font-size: 9px; letter-spacing: .16em; font-weight: 800; margin-bottom: 5px; }
  .modal-sub { color: var(--muted); font-size: 10.5px; margin-top: 4px; }
  .modal-body { padding: 17px 20px 20px; }
  .modal-close {
    width: 29px; height: 29px; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .btn {
    border: 1px solid #3b495d; border-radius: 8px; min-height: 34px; padding: 0 14px;
    background: #222c3a; color: #dce5f0; cursor: pointer; font-weight: 700; font-size: 11px;
    transition: .14s ease;
  }
  .btn:hover:not(:disabled) { background: #2c3849; border-color: #506178; }
  .btn.primary {
    background: linear-gradient(180deg, #ffe09a, #ffc457); border-color: transparent; color: #261d0a;
    box-shadow: 0 4px 16px rgba(255,190,80,.12);
  }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
  .btn.danger { border-color: rgba(255,100,113,.3); color: #ffc9ce; background: rgba(255,100,113,.07); }
  .btn.good { border-color: rgba(85,214,160,.3); color: #c9ffe7; background: rgba(85,214,160,.07); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn.wide { width: 100%; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }

  /* result modal */
  .result-hero { text-align: center; padding: 4px 0 12px; }
  .result-stamp {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(255,209,102,.35); color: var(--accent); background: rgba(255,209,102,.07);
    font-size: 9px; letter-spacing: .13em; font-weight: 850; margin-bottom: 13px;
  }
  .result-stamp.fail { color: var(--bad); border-color: rgba(255,100,113,.35); background: rgba(255,100,113,.06); }
  .result-score { font-size: 44px; line-height: 1; font-weight: 950; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
  .result-score.good { color: var(--accent); }
  .result-score.bad { color: var(--bad); }
  .result-score small { color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: 0; }
  .result-sub { margin-top: 7px; color: var(--muted); font-size: 10.5px; }
  .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 0; }
  .result-stat { padding: 9px; border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255,255,255,.018); }
  .result-stat small { display: block; color: var(--muted-2); font-size: 8.5px; letter-spacing: .08em; margin-bottom: 3px; }
  .result-stat b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .result-warning { margin-top: 13px; padding: 9px 10px; border-radius: 8px; font-size: 10px; color: #ffc7cb; border: 1px solid rgba(255,100,113,.2); background: rgba(255,100,113,.055); }
  .result-rewards { margin-top: 13px; padding: 10px; border-radius: 9px; border: 1px solid rgba(85,214,160,.18); background: rgba(85,214,160,.045); color: #c7f6e2; font-size: 10.5px; }
  .result-rewards b { color: var(--good); }
  .result-rows { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
  .result-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; background: rgba(255,255,255,.022); font-size: 9.5px; color: var(--muted); }
  .result-row b { color: #e8edf5; font-variant-numeric: tabular-nums; }

  /* relic cards */
  .relic-choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
  .relic-choice {
    text-align: left; padding: 15px 13px; min-height: 144px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px;
    background: linear-gradient(155deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
    color: var(--text); transition: .15s ease;
  }
  .relic-choice:hover { border-color: rgba(255,209,102,.48); background: rgba(255,209,102,.055); transform: translateY(-2px); }
  .relic-choice .rc-icon { font-size: 20px; color: var(--accent); font-weight: 900; margin-bottom: 10px; min-height: 24px; }
  .relic-choice .rc-name { font-size: 13px; font-weight: 800; }
  .relic-choice .rc-desc { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.5; }

  /* shop */
  .shop-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 19px; }
  .shop-money { font-size: 17px; font-weight: 850; color: var(--good); font-variant-numeric: tabular-nums; }
  .shop-money small { font-size: 9px; color: var(--muted); font-weight: 500; }
  .shop-columns { display: grid; grid-template-columns: 1.12fr .88fr; gap: 18px; }
  .shop-section-title { font-size: 9px; letter-spacing: .14em; color: var(--muted-2); font-weight: 850; text-transform: uppercase; margin-bottom: 8px; }
  .shop-offers { display: flex; flex-direction: column; gap: 8px; }
  .shop-offer {
    display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 9px;
    border: 1px solid var(--line-soft); background: rgba(255,255,255,.018);
  }
  .shop-offer .so-swatch { width: 6px; align-self: stretch; border-radius: 4px; background: var(--dept-color); }
  .shop-offer .so-icon {
    width: 36px; height: 36px; border-radius: 8px; flex: 0 0 auto;
    display: grid; place-items: center; background: color-mix(in srgb, var(--dept-color) 20%, transparent);
    color: var(--dept-color); font-weight: 900; font-size: 14px;
  }
  .shop-offer .so-main { flex: 1; min-width: 0; }
  .shop-offer .so-name { font-size: 11px; font-weight: 800; }
  .shop-offer .so-desc { font-size: 8.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shop-offer .so-price { font-size: 11px; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .shop-offer.bought { opacity: .45; }
  .shop-relic {
    display: flex; gap: 11px; align-items: flex-start; padding: 13px; border-radius: 9px;
    border: 1px solid rgba(255,209,102,.2); background: rgba(255,209,102,.045);
  }
  .shop-relic .so-icon { color: var(--accent); background: rgba(255,209,102,.1); }
  .shop-relic .so-name { color: var(--accent); font-size: 11px; font-weight: 800; }
  .shop-relic .so-desc { color: #c9c0a8; font-size: 9px; margin-top: 3px; line-height: 1.45; }
  .shop-services { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .service-pill { border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.02); color: var(--muted); font-size: 9px; padding: 5px 7px; }
  .service-pill b { color: #e8edf5; }
  .deck-box { border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(4,7,11,.3); overflow: hidden; }
  .deck-list { max-height: 287px; overflow: auto; padding: 5px; display: flex; flex-direction: column; gap: 3px; }
  .deck-row {
    display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 6px;
    background: rgba(255,255,255,.02); color: var(--muted); font-size: 9px;
  }
  .deck-row:hover { background: rgba(255,255,255,.045); }
  .deck-row .dr-swatch { width: 5px; height: 21px; border-radius: 3px; background: var(--dept-color); flex: 0 0 auto; }
  .deck-row .dr-main { flex: 1; min-width: 0; }
  .deck-row .dr-name { font-size: 9.5px; font-weight: 700; color: #d8e1ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck-row .dr-meta { font-size: 7.5px; color: var(--muted-2); margin-top: 1px; }
  .deck-row .dr-actions { display: flex; gap: 3px; flex: 0 0 auto; }
  .deck-row .tiny-btn {
    font-size: 8px; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--line);
    background: rgba(255,255,255,.025); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .deck-row .tiny-btn:hover:not(:disabled) { color: var(--text); border-color: #4b5a6f; }
  .deck-row .tiny-btn.delete:hover:not(:disabled) { color: #ffc6cb; border-color: rgba(255,100,113,.4); }
  .deck-row .tiny-btn.upgrade:hover:not(:disabled) { color: #fff0bd; border-color: rgba(255,209,102,.4); }
  .deck-row .tiny-btn:disabled { opacity: .28; cursor: not-allowed; }
  .shop-legend { display: flex; justify-content: space-between; gap: 8px; font-size: 8.5px; color: var(--muted-2); margin-top: 7px; }
  .shop-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .shop-next { color: var(--muted); font-size: 9.5px; }
  .shop-next b { color: #dce5f0; }

  /* deck modal */
  .deck-modal-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 480px; overflow: auto; }
  .deck-card-modal {
    display: flex; align-items: center; gap: 9px; padding: 8px;
    border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255,255,255,.02);
  }
  .deck-card-modal .dcm-swatch { width: 5px; align-self: stretch; border-radius: 3px; background: var(--dept-color); }
  .deck-card-modal .dcm-main { flex: 1; min-width: 0; }
  .deck-card-modal .dcm-name { font-size: 10px; font-weight: 750; }
  .deck-card-modal .dcm-meta { font-size: 8px; color: var(--muted); margin-top: 2px; }
  .deck-card-modal .dcm-state { font-size: 8px; color: var(--accent); white-space: nowrap; }

  /* end screen */
  .end-modal { max-width: 660px; text-align: center; }
  .end-mark { font-size: 48px; margin-bottom: 8px; }
  .end-title { font-size: 31px; font-weight: 950; letter-spacing: -.04em; }
  .end-title.dead { color: var(--bad); }
  .end-title.victory { color: var(--accent); }
  .end-title.miss { color: #d9b88d; }
  .end-copy { max-width: 460px; margin: 11px auto 0; color: var(--muted); font-size: 11.5px; line-height: 1.75; }
  .end-stats { display: flex; justify-content: center; gap: 22px; margin: 20px 0; }
  .end-stat small { display: block; font-size: 8.5px; color: var(--muted-2); letter-spacing: .1em; }
  .end-stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .letter {
    margin: 18px auto; max-width: 480px; padding: 17px; border-radius: 3px;
    color: #3a2e1d; text-align: left; background: #f2e7ce; border: 1px solid #d4c5a4;
    font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif; font-size: 11px; line-height: 1.65;
    box-shadow: 0 16px 40px rgba(0,0,0,.3);
  }
  .letter h3 { margin: 0 0 8px; font-size: 15px; }
  .letter .sig { text-align: right; margin-top: 12px; font-style: italic; }

  /* help */
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .help-block { padding: 11px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(255,255,255,.018); }
  .help-block h4 { margin: 0 0 6px; font-size: 10.5px; color: #e5ebf4; }
  .help-block p, .help-block li { margin: 0; color: var(--muted); font-size: 9.5px; line-height: 1.6; }
  .help-block p + p { margin-top: 6px; }
  .help-block ul { margin: 0; padding-left: 15px; }
  .help-block b { color: #dfe7f1; }
  .keycap { display: inline-block; padding: 0 4px; border: 1px solid #445165; border-bottom-width: 2px; border-radius: 4px; font-size: 8px; color: #cbd5e2; }

  /* animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes valuePop { 0% { transform: scale(.6); color: #fff; } 55% { transform: scale(1.18); color: #fff; } 100% { transform: scale(1); } }
  @keyframes boom {
    0% { transform: translate(0,0) scale(1); }
    18% { transform: translate(-4px,1px) scale(1.03); }
    36% { transform: translate(4px,-2px) scale(1.03); }
    54% { transform: translate(-3px,2px) scale(1.01); }
    72% { transform: translate(3px,0) scale(1.01); }
    100% { transform: translate(0,0) scale(1); }
  }
  @keyframes dotPulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
  .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wire.connected { animation: dotPulse 2.8s ease-in-out infinite; }
  .wire.broken { stroke-dasharray: 4 5; animation: none; opacity: .8 !important; }
  .wire.inactive { opacity: .18 !important; }
  .wire-bead { pointer-events: none; }
  .wire-x { font-size: 12px; font-weight: 900; fill: #ff6471; text-anchor: middle; dominant-baseline: central; }
  .cook-dot { filter: drop-shadow(0 0 4px currentColor); }
  .fx-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; overflow: visible; }
  .float-label {
    position: absolute; z-index: 7; pointer-events: none; transform: translate(-50%, -50%);
    font-size: 12px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 8px rgba(0,0,0,.9);
    animation: floatUp .9s ease both;
  }
  .float-label.boom { color: var(--bad); font-size: 14px; letter-spacing: .04em; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%,-35%) scale(.8); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-115%) scale(1.04); } }

  @media (max-width: 1240px) {
    body { min-width: 1140px; }
    .app { max-width: 1200px; padding: 10px; }
    .layout { grid-template-columns: 238px minmax(620px, 1fr) 266px; gap: 10px; }
    .topbar { grid-template-columns: 232px 1fr auto; gap: 10px; }
    .company-panel { padding: 13px; }
    .shop-columns { grid-template-columns: 1fr 1fr; }
  }

  /* ==================================================================
   * 窄屏 / 手机竖屏（< 900px）。桌面布局完全不受影响。
   * ================================================================== */
  @media (max-width: 899px) {
    :root { --dock-h: 154px; }

    html, body {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }
    body { font-size: 12px; min-height: 100dvh; }
    .app { max-width: 100%; padding: 6px 8px 0; }
    #app { width: 100%; padding: 6px 8px 0; }
    #tooltip { display: none; }
    .mt-btn, .mbond, .md-btn, .md-close, .hc-info, .hand-card, .mobile-cook,
    .mc-head, .mobile-board .cell, .mobile-board .node, .modal-close,
    .menu-item, .btn { touch-action: manipulation; }

    /* ---------- 紧凑顶栏 ---------- */
    .mobile-topbar {
      display: flex;
      align-items: stretch;
      gap: 4px;
      padding: 5px 6px;
      margin-bottom: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(27,35,47,.96), rgba(18,24,33,.96));
      box-shadow: 0 8px 22px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.045);
      position: relative;
      z-index: 4;
    }
    .mt-stat {
      flex: 1 1 0; min-width: 0;
      padding: 3px 4px; border-radius: 7px;
      border: 1px solid var(--line-soft);
      background: rgba(9,13,18,.35);
    }
    .mt-stat small {
      display: block; font-size: 8px; letter-spacing: .02em;
      color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mt-stat b {
      display: block; font-size: 11.5px; line-height: 1.2; font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .mt-stat.money b { color: var(--good); }
    .mt-stat.rent b { color: var(--warn); }
    .mt-btn {
      flex: 0 0 auto; min-width: 44px; min-height: 44px;
      padding: 0 7px; border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.045); color: var(--text);
      font-size: 10px; font-weight: 800; white-space: nowrap;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .mt-btn.menu { width: 46px; font-size: 18px; }

    /* ---------- 主列 ---------- */
    .mobile-main {
      display: flex; flex-direction: column; gap: 7px;
      padding-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + 18px);
    }
    .mobile-main > .panel, .mobile-main > section { border-radius: 10px; }

    /* ---------- 公司卡（收起成一行） ---------- */
    .mobile-company {
      padding: 0; position: relative; overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(24,31,42,.95), rgba(17,22,30,.96));
    }
    .mobile-company::after {
      content: ""; position: absolute; width: 110px; height: 110px; right: -50px; top: -55px;
      border-radius: 50%; background: radial-gradient(circle, var(--dept, rgba(255,209,102,.3)), transparent 70%);
      opacity: .18; pointer-events: none;
    }
    .mc-head {
      width: 100%; min-height: 48px; position: relative; z-index: 1;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border: 0; background: transparent; color: inherit;
      text-align: left; cursor: pointer;
    }
    .mc-name {
      flex: 1 1 auto; min-width: 0;
      font-size: 14px; font-weight: 850; letter-spacing: -.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mc-port { width: 15px; height: 15px; flex: 0 0 auto; }
    .mc-num {
      font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
      white-space: nowrap; flex: 0 0 auto;
    }
    .mc-num small { font-size: 9px; color: var(--muted); font-weight: 500; }
    .mc-num.target { color: var(--accent); }
    .mc-caret { color: var(--muted); font-size: 11px; flex: 0 0 auto; }
    .mc-body { position: relative; z-index: 1; padding: 0 10px 11px; border-top: 1px solid var(--line-soft); }
    .mc-body .company-sub { margin-top: 8px; }
    .mc-body .job-requirement { margin: 9px 0 8px; padding: 9px; }
    .mc-body .job-numbers { gap: 6px; }
    .mc-body .rule-desc { font-size: 10px; }
    .mc-body .company-foot { margin-top: 9px; padding-top: 8px; }

    /* ---------- 网格：3 × 6 + 输出口，自适应正方形 ---------- */
    .mobile-board-panel { padding: 5px; }
    .mobile-board-shell {
      position: relative; padding: 3px; border-radius: 9px;
      background: rgba(5,8,12,.45); border: 1px solid var(--line-soft);
    }
    .mobile-board {
      position: relative; z-index: 2;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      width: 100%; max-width: 620px; margin: 0 auto;
    }
    .mobile-board .cell,
    .mobile-board .node,
    .mobile-board .out-slot {
      width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 7px;
    }
    .mobile-board .cell { padding: 0; }
    .mobile-board .cell .cell-plus { font-size: 16px; }
    .mobile-board .cell .cell-coord { left: 3px; top: 2px; font-size: 7px; }
    .mobile-board .cell.empty:hover { border-color: #293443; background: rgba(255,255,255,.012); }
    .mobile-board .node {
      padding: 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .mobile-board .node::after { display: none; }
    .mobile-board .node:hover { transform: none; }
    .mobile-board .node.selected-node {
      box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(255,209,102,.35);
      z-index: 6;
    }
    .mn-name {
      position: relative; z-index: 1;
      font-size: 10px; line-height: 1.05; font-weight: 850;
      letter-spacing: -.01em; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mn-value {
      position: relative; z-index: 1;
      font-size: 13px; line-height: 1; font-weight: 850;
      font-variant-numeric: tabular-nums; letter-spacing: -.04em;

    }
    .mn-value.empty-value { opacity: .5; font-size: 11px; }
    .mn-mark {
      position: absolute; top: 1px; right: 2px; z-index: 2;
      font-size: 7px; line-height: 1; font-weight: 900;
      padding: 1px 2px; border-radius: 3px;
      background: rgba(6,9,13,.45); color: #ffd0d2;
    }
    .mn-mark.vex { color: #c5ffdf; }
    .mn-mark.star { color: var(--accent); }
    .mn-mark.pass { color: #cfd8e4; }
    .mobile-board .out-slot {
      padding: 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    }
    .mobile-board .out-top { font-size: 7px; letter-spacing: .05em; }
    .mobile-board .out-mid { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .mobile-board .out-mid .target-port-large { width: 10px !important; height: 10px !important; }
    .mobile-board .out-value { font-size: 11px; letter-spacing: -.03em; }
    .mobile-board .out-type { display: none; }
    .mobile-board .target-port-large { width: 11px; height: 11px; }
    .mobile-board-shell .float-label { font-size: 10px; }
    .mobile-board-shell .float-label.boom { font-size: 11px; }

    /* ---------- 估分条 ---------- */
    .mobile-estimate {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 9px;
      border: 1px solid var(--line); border-radius: 10px;
      background: linear-gradient(180deg, rgba(24,31,42,.95), rgba(17,22,30,.96));
    }
    .me-item {
      display: flex; align-items: baseline; gap: 3px;
      min-width: 0; white-space: nowrap;
    }
    .me-item small {
      font-size: 8.5px; letter-spacing: .07em; font-weight: 800;
      color: var(--muted-2);
    }
    .me-item b { font-size: 12px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .me-item .dim { font-size: 9.5px; }
    .me-sep { width: 1px; align-self: stretch; background: var(--line-soft); flex: 0 0 auto; }
    .me-score b { color: var(--accent); }
    .me-score.ok b { color: var(--good); }
    .me-time.over b { color: var(--bad); }
    .me-risk b { color: var(--warn); }
    .me-risk.zero b { color: var(--muted); }

    /* ---------- 羁绊一行 ---------- */
    .mobile-bonds { display: flex; gap: 4px; }
    .mbond {
      --bond-color: var(--model);
      flex: 1 1 0; min-width: 0; min-height: 42px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; padding: 3px 2px;
      border: 1px solid var(--line-soft); border-radius: 8px;
      background: rgba(255,255,255,.025); color: var(--muted);
      font-size: 10px; font-weight: 700; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    .mbond.model { --bond-color: var(--model); }
    .mbond.fx { --bond-color: var(--fx); }
    .mbond.lighting { --bond-color: var(--lighting); }
    .mbond.comp { --bond-color: var(--comp); }
    .mbond .m-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .mbond .m-count { font-size: 9px; font-variant-numeric: tabular-nums; color: var(--muted-2); }
    .mbond.active {
      border-color: color-mix(in srgb, var(--bond-color) 55%, transparent);
      background: color-mix(in srgb, var(--bond-color) 14%, transparent);
      color: #eef3f9;
    }
    .mbond.active .m-count { color: var(--bond-color); font-weight: 850; }

    /* ---------- 底部固定：Cook + 手牌 ---------- */
    .mobile-dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(14,19,26,.985), rgba(9,12,17,.995));
      border-top: 1px solid var(--line);
      box-shadow: 0 -12px 34px rgba(0,0,0,.5);

      width: 100%; height: 48px; min-height: 48px;
      margin: 0; border-radius: 10px; font-size: 15px;
    }
    .mobile-cook span { font-size: 11px; letter-spacing: .03em; opacity: .72; }
    .mobile-hand { margin-top: 6px; border: 0; background: transparent; box-shadow: none; padding: 0; }
    .mobile-hand .hand-list {
      display: flex; flex-wrap: nowrap; justify-content: flex-start;
      gap: 6px; min-height: 88px; height: 88px;

      padding: 0 1px;

    .mobile-hand .hand-list::-webkit-scrollbar { display: none; }
    .mobile-hand .hand-card {
      width: 64px; height: 88px; flex: 0 0 64px;
      border-radius: 8px; padding: 5px 5px 4px;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

    .mobile-hand .hand-card:hover,
    .mobile-hand .hand-card.selected { transform: none; }
    .mobile-hand .hc-name { font-size: 10px; }
    .mobile-hand .hc-cn { font-size: 8px; margin-top: 1px; }
    .mobile-hand .hc-op { margin-top: 5px; font-size: 13px; }
    .mobile-hand .hc-meta { margin-top: 3px; font-size: 8px; }
    .mobile-hand .hc-portline { display: none; }
    .mobile-hand .hand-empty { flex: 1; min-height: 88px; height: 88px; }
    .mobile-hand .hc-info {
      position: absolute; right: 0; bottom: 0; z-index: 4;
      width: 40px; height: 40px; padding: 0; border: 0; background: transparent;
      display: flex; align-items: flex-end; justify-content: flex-end;
      cursor: pointer;
    }
    .mobile-hand .hc-info span {
      width: 22px; height: 22px;
      display: grid; place-items: center; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.42);
      background: rgba(0,0,0,.42); color: #fff;
      font-size: 11px; font-weight: 850; line-height: 1;
    }

    /* ---------- 节点详情面板（底部弹出） ---------- */
    .mobile-detail {
      position: fixed; left: 8px; right: 8px;
      bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + 6px);
      z-index: 55; max-height: 46vh; overflow-y: auto;
      padding: 9px 10px 10px;
      border: 1px solid #3d4b5e; border-radius: 12px;
      background: linear-gradient(180deg, #1b2330, #121821);
      box-shadow: 0 18px 50px rgba(0,0,0,.62);
    }
    .md-head { display: flex; align-items: center; gap: 6px; }
    .md-title { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 850; }
    .md-title small { font-size: 9px; color: var(--muted); font-weight: 600; }
    .md-close {
      width: 40px; height: 40px; flex: 0 0 auto;
      border-radius: 8px; border: 1px solid var(--line);

    .md-desc { margin-top: 6px; font-size: 10.5px; line-height: 1.5; color: #c2cbd8; }

    }

    .md-actions { display: flex; align-items: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .md-btn {
      min-height: 42px; padding: 0 10px;
      border-radius: 8px; border: 1px solid #3b495d;
      background: #222c3a; color: #dce5f0;
      font-weight: 800; font-size: 11px; cursor: pointer;
    }
    .md-btn.primary { background: linear-gradient(180deg, #ffe09a, #ffc457); border-color: transparent; color: #261d0a; }
    .md-btn.vex { border-color: rgba(85,214,160,.5); color: #c7ffe4; background: rgba(6,18,13,.36); }
    .md-stepper {
      display: inline-flex; align-items: center;

    .md-stepper button {
      width: 42px; height: 42px; padding: 0; border: 0;
      background: rgba(255,255,255,.05); color: #dce5f0;
      font-size: 17px; font-weight: 900; cursor: pointer;

    /* ---------- toast 抬到固定栏上方 ---------- */
    #toast {
      bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + 12px);
      max-width: calc(100vw - 24px);
    }

    /* ---------- 弹层：全屏、可滚动、大按钮 ---------- */
    .backdrop { padding: 0; align-items: stretch; }
    .modal, .modal.wide, .modal.shop-modal, .end-modal {
      width: 100%; max-width: 100%;
      height: 100vh; height: 100dvh; max-height: 100dvh;
      border-radius: 0; border: 0;

      border-bottom: 1px solid var(--line-soft);

    .modal-title { font-size: 18px; }
    .modal-sub { font-size: 11px; }
    .modal-close { width: 44px; height: 44px; font-size: 20px; }
    .modal-body { padding: 12px 12px calc(20px + env(safe-area-inset-bottom)); }
    .modal-actions { flex-direction: column; gap: 8px; margin-top: 16px; }

    .btn { min-height: 46px; font-size: 13px; }
    .result-stats { grid-template-columns: 1fr; gap: 6px; }
    .result-score { font-size: 38px; }
    .relic-choice-grid { grid-template-columns: 1fr; }
    .relic-choice { min-height: 0; padding: 14px; }
    .relic-choice:hover { transform: none; }
    .shop-columns { grid-template-columns: 1fr; gap: 14px; }
    .shop-topline { flex-wrap: wrap; }
    .shop-offer { gap: 8px; padding: 9px; }

    /* mobile-only modals */
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      width: 100%; min-height: 50px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 14px; border-radius: 10px;

      color: var(--text); font-size: 14px; font-weight: 750; cursor: pointer;
    }
    .menu-item .menu-arrow { color: var(--muted); font-size: 18px; }

    .relic-row {

      width: 38px; height: 38px; flex: 0 0 auto;

    }
    .relic-row .rr-name { color: var(--accent); font-size: 13px; font-weight: 800; }
    .relic-row .rr-desc { margin-top: 3px; color: #cfd6e0; font-size: 10.5px; line-height: 1.5; }

  /* ==================================================================
   * 手机横屏（orientation: landscape 且 max-height: 520px）。
   * 三栏一屏，页面不滚动；覆盖上面的 < 900px 竖屏布局，桌面不受影响。
   * ================================================================== */
  @media (orientation: landscape) and (max-height: 520px) {
    html, body {
      width: 100%; max-width: 100%; min-width: 0;
      height: 100%; max-height: 100%;
      overflow: hidden;
    }
    body { font-size: 11px; min-height: 0; }
    #app { width: 100%; height: 100vh; height: 100dvh; padding: 0; overflow: hidden; }
    #tooltip { display: none; }
    #toast {
      bottom: calc(8px + env(safe-area-inset-bottom));
      font-size: 10px; max-width: calc(100vw - 30px);
    }

    .ls-app {
      height: 100vh; height: 100dvh;
      display: grid;
      grid-template-columns: clamp(126px, 19vw, 168px) minmax(0, 1fr) clamp(116px, 17.5vw, 148px);
      gap: 6px;
      padding: 6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
      overflow: hidden;
    }
    .ls-left, .ls-right, .ls-center { min-width: 0; min-height: 0; }

    /* ---------- 左栏：月/关、钱、房租、公司卡、菜单 ---------- */
    .ls-left { display: flex; flex-direction: column; gap: 5px; }
    .ls-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .ls-stat {
      min-width: 0; padding: 4px 6px; border-radius: 7px;
      border: 1px solid var(--line-soft); background: rgba(9,13,18,.35);
    }
    .ls-stat.wide { grid-column: 1 / -1; }
    .ls-stat small {
      display: block; font-size: 10px; line-height: 1.1; letter-spacing: .02em;
      color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ls-stat b {
      display: block; margin-top: 1px; font-size: 13px; line-height: 1.15; font-weight: 850;
      font-variant-numeric: tabular-nums; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .ls-stat.money b { color: var(--good); }
    .ls-stat.rent b { color: var(--warn); }

    .ls-company {
      position: relative; overflow: hidden; flex: 0 0 auto;
      padding: 7px; border: 1px solid var(--line); border-radius: 9px;
      background: linear-gradient(180deg, rgba(24,31,42,.95), rgba(17,22,30,.96));
    }
    .ls-company::after {
      content: ""; position: absolute; width: 100px; height: 100px; right: -48px; top: -52px;
      border-radius: 50%; background: radial-gradient(circle, var(--dept, rgba(255,209,102,.3)), transparent 70%);
      opacity: .18; pointer-events: none;
    }
    .ls-company-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .ls-company-top .panel-label { font-size: 10px; letter-spacing: .06em; }
    .ls-company-top .tier-badge { font-size: 10px; }
    .ls-cname {
      position: relative; z-index: 1; margin-top: 4px;
      font-size: 15px; line-height: 1.12; font-weight: 850; letter-spacing: -.01em;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .ls-req {
      position: relative; z-index: 1; display: flex; align-items: center; gap: 5px;
      margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line-soft);
    }
    .ls-req b { font-size: 12px; font-weight: 800; }
    .ls-req .target-port-large { width: 16px; height: 16px; }
    .ls-nums { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 5px; }
    .ls-nums small {
      display: block; font-size: 10px; line-height: 1.1; color: var(--muted-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ls-nums b { display: block; font-size: 13px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .ls-rule {
      position: relative; z-index: 1;
      width: 100%; min-height: 40px; margin-top: 6px;
      display: flex; align-items: center; gap: 5px;
      padding: 5px 6px; border-radius: 7px; cursor: pointer;
      border: 1px solid rgba(255,171,92,.22); background: rgba(255,171,92,.06);
      color: #ffd09a; text-align: left; font-size: 10px; font-weight: 750;
    }
    .ls-rule .ls-rule-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ls-rule .ls-rule-i {
      width: 18px; height: 18px; flex: 0 0 auto; border-radius: 50%;
      display: grid; place-items: center; font-size: 10px; font-weight: 900;
      border: 1px solid rgba(255,171,92,.45); color: var(--warn);
    }
    .ls-left-bottom { margin-top: auto; display: flex; gap: 4px; }
    .ls-bottom-btn {
      flex: 1 1 0; min-width: 0; min-height: 40px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 0 4px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: rgba(255,255,255,.045);
      color: var(--text); font-size: 11px; font-weight: 800; white-space: nowrap;
      touch-action: manipulation;
    }
    .ls-bottom-btn.menu { flex: 0 0 44px; font-size: 18px; }

    /* ---------- 中间：自适应正方形网格 + 横向手牌 ---------- */
    .ls-center { display: flex; flex-direction: column; gap: 6px; }
    .ls-board-host {
      flex: 1 1 auto; min-height: 0; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .ls-board-shell {
      position: relative; display: inline-block;
      padding: 4px; border-radius: 9px;
      background: rgba(5,8,12,.45); border: 1px solid var(--line-soft);
    }
    .ls-board { position: relative; z-index: 2; display: grid; gap: 4px; width: max-content; margin: 0; }
    .ls-board .cell, .ls-board .node, .ls-board .out-slot {
      width: 100%; height: 100%; aspect-ratio: auto; border-radius: 6px;
    }
    .ls-board .cell { padding: 0; }
    .ls-board .cell .cell-plus { font-size: 16px; }
    .ls-board .cell .cell-coord { left: 3px; top: 2px; font-size: 10px; }
    .ls-board .node {
      padding: 2px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .ls-board .node::after { display: none; }
    .ls-board .node:hover { transform: none; }
    .ls-board .node.selected-node {
      box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(255,209,102,.35);
      z-index: 6;
    }
    .ls-board .mn-name {
      position: relative; z-index: 1;
      font-size: 11px; line-height: 1.05; font-weight: 850; letter-spacing: -.01em;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ls-board .mn-value {
      position: relative; z-index: 1;
      font-size: 15px; line-height: 1; font-weight: 850;
      font-variant-numeric: tabular-nums; letter-spacing: -.04em;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .ls-board .mn-value.empty-value { opacity: .5; font-size: 12px; }
    .ls-board .mn-mark {
      position: absolute; top: 1px; right: 2px; z-index: 2;
      font-size: 10px; line-height: 1; font-weight: 900;
      padding: 1px 2px; border-radius: 3px;
      background: rgba(6,9,13,.45); color: #ffd0d2;
    }
    .ls-board .mn-mark.vex { color: #c5ffdf; }
    .ls-board .mn-mark.star { color: var(--accent); }
    .ls-board .mn-mark.pass { color: #cfd8e4; }
    .ls-board .out-slot {
      padding: 2px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    .ls-board .out-top { font-size: 10px; letter-spacing: .05em; }
    .ls-board .out-mid { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .ls-board .out-value { font-size: 13px; letter-spacing: -.03em; }
    .ls-board .out-type { display: none; }
    .ls-board .target-port-large { width: 12px; height: 12px; }
    .ls-board-shell .float-label { font-size: 11px; }
    .ls-board-shell .float-label.boom { font-size: 12px; }

    .ls-hand { flex: 0 0 auto; min-width: 0; }
    .ls-hand .hand-list {
      display: flex; flex-wrap: nowrap; justify-content: flex-start;
      gap: 5px; height: 78px; min-height: 78px;
      overflow-x: auto; overflow-y: hidden; padding: 0 1px 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .ls-hand .hand-list::-webkit-scrollbar { display: none; }
    .ls-hand .hand-card {
      width: 58px; height: 78px; flex: 0 0 58px;
      border-radius: 7px; padding: 4px;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .ls-hand .hand-card:hover, .ls-hand .hand-card.selected { transform: none; }
    .ls-hand .hc-name { font-size: 10px; }
    .ls-hand .hc-star { font-size: 10px; }
    .ls-hand .hc-op { margin-top: 4px; font-size: 13px; }
    .ls-hand .hc-op small { font-size: 10px; }
    .ls-hand .hc-meta {
      margin-top: 3px; font-size: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ls-hand .hand-empty {
      flex: 1; min-height: 78px; height: 78px;
      display: grid; place-items: center; font-size: 11px;
    }

    /* ---------- 右栏：估分、耗时、爆炸、羁绊、COOK ---------- */
    .ls-right { display: flex; flex-direction: column; gap: 5px; }
    .ls-card {
      padding: 5px 7px; border-radius: 8px;
      border: 1px solid var(--line); background: rgba(20,27,36,.85);
    }
    .ls-est-line { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
    .ls-est-line b {
      font-size: 21px; line-height: 1; font-weight: 900; letter-spacing: -.04em;
      font-variant-numeric: tabular-nums; color: var(--accent);
    }
    .ls-est-line b.ok { color: var(--good); }
    .ls-est-line span { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .ls-kv { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
    .ls-kv small { font-size: 10px; letter-spacing: .06em; color: var(--muted-2); font-weight: 800; white-space: nowrap; }
    .ls-kv b { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ls-kv b.over { color: var(--bad); }
    .ls-bar {
      height: 5px; margin-top: 4px; border-radius: 10px; overflow: hidden;
      background: #090d13; border: 1px solid #273243;
    }
    .ls-bar > i {
      display: block; height: 100%; width: 0; border-radius: 10px;
      background: linear-gradient(90deg, #e6a935, #ffd166); transition: width .2s;
    }
    .ls-bar.good > i { background: linear-gradient(90deg, #36ad7d, #67e5b1); }
    .ls-bar.time > i { background: linear-gradient(90deg, #356eaa, #62b1ff); }
    .ls-bar.warn > i { background: linear-gradient(90deg, #b07a2b, #ffbe62); }
    .ls-bar.over > i { background: linear-gradient(90deg, #a93845, #ff6471); }
    .ls-risk-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .ls-risk-row small { font-size: 10px; letter-spacing: .06em; color: var(--muted-2); font-weight: 800; }
    .ls-risk-row b { font-size: 13px; color: var(--warn); font-variant-numeric: tabular-nums; }
    .ls-risk-row b.zero { color: var(--muted); }
    .ls-bonds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .ls-bond {
      --bond-color: var(--model);
      min-width: 0; min-height: 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      padding: 3px 2px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--line-soft); background: rgba(255,255,255,.025);
      color: var(--muted); font-size: 10px; font-weight: 750;
      white-space: nowrap; overflow: hidden; touch-action: manipulation;
    }
    .ls-bond.model { --bond-color: var(--model); }
    .ls-bond.fx { --bond-color: var(--fx); }
    .ls-bond.lighting { --bond-color: var(--lighting); }
    .ls-bond.comp { --bond-color: var(--comp); }
    .ls-bond .ls-b-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .ls-bond .ls-b-count { font-size: 10px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
    .ls-bond.active {
      border-color: color-mix(in srgb, var(--bond-color) 55%, transparent);
      background: color-mix(in srgb, var(--bond-color) 14%, transparent);
      color: #eef3f9;
    }
    .ls-bond.active .ls-b-count { color: var(--bond-color); font-weight: 850; }
    .ls-cook-wrap { margin-top: auto; }
    .ls-cook {
      width: 100%; min-height: 48px; height: 48px; margin-top: 0;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 9px; font-size: 15px; letter-spacing: .1em;
    }
    .ls-cook span { font-size: 10px; letter-spacing: .02em; opacity: .72; }
    .ls-cook-sub {
      min-height: 12px; margin-top: 3px; text-align: center;
      font-size: 10px; line-height: 1.2; color: var(--muted-2);
    }
    .ls-cook-sub.bad { color: var(--bad); }

    /* ---------- 节点详情：从右侧滑出，盖住右栏 ---------- */
    .ls-detail {
      position: fixed; top: 0; right: 0; bottom: 0; left: auto;
      z-index: 56; width: min(240px, 62vw); max-height: none;
      overflow-y: auto; overflow-x: hidden;
      padding: 10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) 10px;
      border: 0; border-left: 1px solid #3d4b5e; border-radius: 0;
      background: linear-gradient(180deg, #1b2330, #121821);
      box-shadow: -16px 0 40px rgba(0,0,0,.58);
      animation: lsSlideIn .18s ease both;
    }
    .ls-detail .md-head { display: flex; align-items: center; gap: 6px; }
    .ls-detail .md-title { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 850; }
    .ls-detail .md-title small { font-size: 10px; color: var(--muted); font-weight: 600; }
    .ls-detail .md-close {
      width: 40px; height: 40px; flex: 0 0 auto;
      border-radius: 8px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: var(--muted);
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .ls-detail .md-desc { margin-top: 8px; font-size: 11px; line-height: 1.5; color: #c2cbd8; }
    .ls-detail .md-stats {
      display: flex; flex-direction: column; gap: 4px;
      margin-top: 9px; font-size: 11px; line-height: 1.45; color: var(--muted);
    }
    .ls-detail .md-stats b { color: #e6edf6; font-variant-numeric: tabular-nums; }
    .ls-detail .md-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .ls-detail .md-btn {
      min-height: 40px; padding: 0 10px; border-radius: 8px;
      border: 1px solid #3b495d; background: #222c3a; color: #dce5f0;
      font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .ls-detail .md-btn.primary { background: linear-gradient(180deg, #ffe09a, #ffc457); border-color: transparent; color: #261d0a; }
    .ls-detail .md-btn.vex { border-color: rgba(85,214,160,.5); color: #c7ffe4; background: rgba(6,18,13,.36); }
    .ls-detail .md-stepper {
      display: inline-flex; align-items: center; overflow: hidden;
      border: 1px solid #3b495d; border-radius: 8px; background: rgba(4,7,10,.32);
    }
    .ls-detail .md-stepper span { min-width: 40px; text-align: center; font-size: 12px; font-weight: 800; }
    .ls-detail .md-stepper button {
      width: 40px; height: 40px; padding: 0; border: 0;
      background: rgba(255,255,255,.05); color: #dce5f0;
      font-size: 17px; font-weight: 900; cursor: pointer;
    }
    @keyframes lsSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    /* ---------- 弹层：全屏、内部纵向滚动 ---------- */
    .backdrop { padding: 0; align-items: stretch; }
    .modal, .modal.wide, .modal.shop-modal, .end-modal {
      width: 100%; max-width: 100%;
      height: 100vh; height: 100dvh; max-height: 100dvh;
      border-radius: 0; border: 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-head {
      position: sticky; top: 0; z-index: 3; flex: 0 0 auto;
      padding: 10px 14px 9px; background: #19212d;
      border-bottom: 1px solid var(--line-soft);
    }
    .modal-title { font-size: 16px; }
    .modal-sub { font-size: 10px; }
    .modal-close { width: 40px; height: 40px; font-size: 18px; }
    .modal-body {
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
      overflow-y: auto; flex: 1 1 auto; min-height: 0;
    }
    .modal-actions { flex-direction: row; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .modal-actions .btn { width: auto; }
    .btn { min-height: 40px; font-size: 12px; }
    .result-stats { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .result-score { font-size: 34px; }
    .result-hero { padding: 0 0 8px; }
    .relic-choice-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .relic-choice { min-height: 0; padding: 10px; }
    .relic-choice:hover { transform: none; }
    .shop-columns { grid-template-columns: 1fr 1fr; gap: 12px; }
    .shop-topline { margin-bottom: 10px; }
    .shop-offer { gap: 7px; padding: 7px; }
    .shop-offer .btn { min-height: 40px; }
    .shop-offer .so-desc { white-space: normal; overflow: visible; text-overflow: clip; }
    .shop-footer { flex-direction: row; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; }
    .shop-footer .btn { width: auto; }
    .deck-modal-list { grid-template-columns: repeat(2, 1fr); max-height: none; }
    .deck-list { max-height: none; }
    .deck-row { padding: 6px; font-size: 10px; }
    .deck-row .tiny-btn { min-height: 40px; font-size: 10px; padding: 0 8px; }
    .help-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .end-title { font-size: 26px; }
    .end-copy { font-size: 11px; }
    .end-stats { flex-wrap: wrap; gap: 10px 20px; margin: 12px 0; }
    .end-modal .btn { width: auto; }
    .letter { max-width: 480px; padding: 13px; font-size: 10.5px; }

    /* 竖屏里定义的移动组件在 ≥900px 横屏也要有样式 */
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      width: 100%; min-height: 40px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 0 14px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255,255,255,.03);
      color: var(--text); font-size: 13px; font-weight: 750; cursor: pointer;
    }
    .menu-item .menu-arrow { color: var(--muted); font-size: 18px; }
    .relics-list { display: flex; flex-direction: column; gap: 8px; }
    .relic-row {
      display: flex; gap: 10px; padding: 10px;
      border: 1px solid rgba(255,209,102,.22); border-radius: 9px;
      background: rgba(255,209,102,.045);
    }
    .relic-row .rr-icon {
      width: 34px; height: 34px; flex: 0 0 auto;
      display: grid; place-items: center; border-radius: 8px;
      background: rgba(255,209,102,.12); color: var(--accent);
      font-weight: 900; font-size: 13px;
    }
    .relic-row .rr-name { color: var(--accent); font-size: 13px; font-weight: 800; }
    .relic-row .rr-desc { margin-top: 3px; color: #cfd6e0; font-size: 11px; line-height: 1.5; }
    .cardinfo-stats { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .cardinfo-stats b { color: #e6edf6; }
    .cardinfo-desc { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #c6cfdc; }

    /* 横屏下弹层内的辅助文字也保持 ≥ 10px */
    .modal-kicker, .result-stamp, .result-sub, .result-stat small, .result-row,
    .shop-section-title, .shop-money small, .shop-offer .so-desc, .service-pill,
    .shop-legend, .shop-next, .deck-row, .deck-row .dr-name, .deck-row .dr-meta,
    .deck-card-modal .dcm-name, .deck-card-modal .dcm-meta, .deck-card-modal .dcm-state,
    .help-block p, .help-block li, .end-stat small,
    .panel-kicker, .muted-line, .shop-relic .so-desc { font-size: 10px; }
  }
</style>
