<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Node Rogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d16; --bg2:#121524; --panel:#171b2e; --panel2:#1e2340; --line:#2c3358; --line2:#3c4578;
  --text:#eceaf6; --muted:#8f96bd; --dim:#5d6490;
  --gold:#ffd84a; --gold2:#c99a1c; --good:#5ed38a; --bad:#ff5a6a; --warn:#ffab4a; --pink:#ff7ab8; --cyan:#5ee0ff; --violet:#b98cff;
  --model:#9aa7b8; --plate:#7fc8a9; --surf:#c79a5a; --char:#e86fa3; --fx:#f08a3c; --light:#4f9cf0; --comp:#a876f0; --util:#e6e6e6;
  --cs:66px;
  --font:"Pixelify Sans","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"Silkscreen","Pixelify Sans",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:none;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);z-index:999;mix-blend-mode:multiply}
button{font-family:inherit;font-size:inherit;color:inherit}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:auto;background:#000}
img.px{image-rendering:pixelated}
#app{max-width:1380px;margin:0 auto;padding:12px 16px 90px}
.btn{background:var(--panel2);border:2px solid var(--line2);padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #05060c;position:relative;transition:transform .05s;text-align:center}
.btn:hover{border-color:var(--gold);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #05060c}
.btn[disabled]{opacity:.42;cursor:not-allowed;border-color:var(--line)}
.btn.gold{background:var(--gold);color:#1a1405;border-color:#fff3a0;font-weight:700}
.btn.gold:hover{background:#ffe27a}
.btn.pink{background:var(--pink);color:#2a0a1a;border-color:#ffc0e0;font-weight:700}
.btn.cyan{background:#1f5a6a;border-color:var(--cyan)}
.btn.small{padding:4px 8px;font-size:13px}
.btn.ghost{background:transparent}
.btn.big{font-size:22px;padding:12px 26px}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 4px 0 #05060c;padding:12px}
.ptitle{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .goldt{color:var(--gold)} .warn{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:2px solid var(--line2);background:var(--bg2);font-size:13px;white-space:nowrap}
.chip.ok{border-color:var(--good);color:var(--good)} .chip.no{border-color:var(--bad);color:var(--bad)} .chip.hid{border-style:dashed;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;padding:2px 5px;background:#000;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}

/* HUD */
.hud{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.hud .cell{background:var(--panel);border:2px solid var(--line);padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-width:86px;box-shadow:0 3px 0 #05060c}
.hud .k{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}
.hud .v{font-size:18px;font-weight:700}
.hud .grow{flex:1}
.hud .relics{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.hud .relics img{width:24px;height:24px;cursor:help;background:#000;border:1px solid var(--line2)}
.hud .act{font-family:var(--mono);font-size:11px;color:var(--pink)}
.hud .cell.tools{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center;max-width:260px}
.cash-neg{color:var(--bad)}

/* title */
.title-wrap{max-width:900px;margin:20px auto;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.title-wrap canvas{border:3px solid var(--line2);box-shadow:0 0 0 3px #000,0 10px 40px rgba(255,80,180,.25)}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.bgcard{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.bgcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.bgcard .icons{display:flex;gap:4px;flex-wrap:wrap}
.bgcard .icons img{width:30px;height:30px;background:#000;border:1px solid var(--line2)}

/* inbox */
.inbox{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;gap:8px;align-items:center;padding:6px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;text-align:left}
.mitem.on{border-color:var(--gold)} .mitem.unread .subj::before{content:"● ";color:var(--pink)}
.mitem img{width:36px;height:36px;flex:none}
.mitem .subj{font-weight:700}
.mbody{white-space:pre-wrap}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mhead img{width:64px;height:64px;border:2px solid var(--line2)}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.result{margin-top:10px;padding:8px;border-left:4px solid var(--gold);background:#000;white-space:pre-wrap}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.job{display:flex;flex-direction:column;gap:8px;position:relative}
.job .who{display:flex;gap:10px;align-items:center}
.job .who img{width:56px;height:56px;border:2px solid var(--line2);flex:none}
.job .ttl{font-size:20px;font-weight:700;line-height:1.1}
.job .kind{font-family:var(--mono);font-size:11px;padding:2px 6px;display:inline-block;margin-bottom:2px}
.job.gig .kind{background:#1d3a2a;color:var(--good)} .job.portfolio .kind{background:#2a1d3a;color:var(--violet)} .job.test .kind{background:#3a2a10;color:var(--gold)}
.job.test{border-color:var(--gold2)}
.job.locked{opacity:.85}
.job .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.elchip{display:inline-flex;gap:4px;align-items:center;padding:3px 8px;border:2px solid;font-weight:700;cursor:pointer;background:var(--bg2)}
.elchip.on{background:#000;box-shadow:0 0 0 2px #000,0 0 12px currentColor}
.gate-line{font-size:13px}

/* work */
.work{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:12px;align-items:start}
.work > div,.inbox > div,.split2 > div{min-width:0}
.brief .who{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.brief .who img{width:48px;height:48px;border:2px solid var(--line2)}
.reqlist{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.req{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.req .b{width:16px;flex:none;text-align:center;font-weight:700}
.req.ok .b{color:var(--good)} .req.no .b{color:var(--bad)} .req.hid{color:var(--muted);font-style:italic}
.req small{display:block;color:var(--dim);font-size:12px}
.notes{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.note{background:#000;border-left:3px solid var(--pink);padding:5px 8px;font-size:14px}
.note .nh{font-family:var(--mono);font-size:10px;color:var(--muted)}
.gridwrap{overflow-x:auto;padding-bottom:6px}
.gridbox{position:relative;display:inline-grid;gap:6px;padding:8px;background:repeating-linear-gradient(45deg,#0e1120 0 6px,#101426 6px 12px);border:2px solid var(--line)}
.gridbox svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gc{width:var(--cs);height:var(--cs);border:2px dashed #2a3150;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
.gc:hover{border-color:var(--gold)}
.gc.empty{background:transparent}
.gc.drop{border-color:var(--cyan);background:rgba(94,224,255,.08)}
.gc.node{border-style:solid;background:#0d1020;flex-direction:column;gap:1px;box-shadow:0 3px 0 #05060c}
.gc.node img{width:30px;height:30px}
.gc.node .nm{font-size:10px;line-height:1;text-align:center;max-width:calc(var(--cs) - 6px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc.sel{outline:3px solid var(--gold);outline-offset:1px}
.gc.err{background:#2a0a12}
.gc .badge{position:absolute;font-family:var(--mono);font-size:9px;padding:0 3px;line-height:12px}
.gc .b-err{top:-7px;right:-7px;background:var(--bad);color:#fff;width:16px;height:16px;line-height:16px;text-align:center;font-size:11px;border-radius:0}
.gc .b-cache{bottom:-6px;left:-6px;background:var(--good);color:#032}
.gc .b-solv{top:-7px;left:-7px;background:var(--fx);color:#200}
.gc .b-q{bottom:-6px;right:-6px;background:#000;color:var(--gold)}
.gc .b-col{top:-7px;right:14px;background:var(--util);color:#000}
.gc.out{border:2px solid var(--gold2);background:#1a1408;cursor:default;flex-direction:column;font-size:11px;text-align:center}
.gc.out.best{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,216,74,.5)}
.gc.out .ostar{color:var(--gold);font-weight:700;font-size:13px}
.colram{display:flex;gap:6px;padding:0 8px;margin-top:4px}
.colram div{width:var(--cs);height:6px;background:#1a1e34;position:relative}
.colram div i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.colram div.hot i{background:var(--warn)} .colram div.over i{background:var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tcard{display:flex;align-items:center;gap:6px;padding:4px 7px 4px 4px;border:2px solid var(--line2);background:var(--bg2);cursor:grab;user-select:none;min-width:0}
.tcard img{width:26px;height:26px;background:#000;flex:none}
.tcard .tn{font-size:13px;line-height:1.05}
.tcard .tm{font-family:var(--mono);font-size:9px;color:var(--muted)}
.tcard.on{border-color:var(--gold);background:#2a2410}
.tcard:hover{border-color:var(--gold)}
.dgroup{font-family:var(--mono);font-size:10px;color:var(--muted);width:100%;margin-top:4px}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:3px 0}
.bar{height:8px;background:#0a0c18;border:1px solid var(--line);position:relative;margin:2px 0 6px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.bar b{position:absolute;top:0;bottom:0;background:var(--warn);opacity:.7}
.pips{display:flex;gap:3px} .pips i{width:14px;height:10px;background:var(--line2)} .pips i.on{background:var(--pink)}
.cookbar{display:flex;gap:8px;margin-top:8px}
.cookbar .btn{flex:1}
.inspector .ih{display:flex;gap:8px;align-items:center}
.inspector .ih img{width:40px;height:40px;background:#000;border:2px solid var(--line2)}
.qbtns{display:flex;gap:4px}
.qbtns .btn{min-width:34px}
.qbtns .btn.on{border-color:var(--gold);color:var(--gold)}
.tut{background:#1d1430;border:2px solid var(--violet);padding:8px 10px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.tut img{width:36px;height:36px;flex:none}
.vpwrap{position:relative}
.vpcap{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.6);padding:2px 5px}
.gradebig{font-size:56px;font-weight:700;line-height:1}
.g-S{color:var(--gold);text-shadow:0 0 18px rgba(255,216,74,.7)} .g-A{color:var(--good)} .g-B{color:var(--cyan)} .g-C{color:var(--muted)} .g-F{color:var(--bad)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(4,5,12,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:3px solid var(--line2);box-shadow:0 0 0 3px #000,0 20px 60px rgba(0,0,0,.6);max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:16px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.simrow{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;margin:6px 0}
.simbar{height:14px;background:#0a0c18;border:2px solid var(--line);position:relative;overflow:hidden}
.simbar i{position:absolute;left:0;top:0;bottom:0}
.simbar .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.simbar .pred{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.bandrow{display:flex;gap:6px;margin-top:4px}
.bandpip{font-family:var(--mono);font-size:10px;line-height:1.4;padding:1px 6px;border:1px solid var(--line);color:var(--muted);opacity:.45}
.bandpip.on{opacity:1;font-weight:700}
.bandpip.steady.on{border-color:var(--good);color:var(--good)}
.bandpip.warn.on{border-color:var(--warn);color:var(--warn)}
.bandpip.danger.on{border-color:var(--bad);color:var(--bad)}
.notepick{margin-top:8px;padding:8px;background:#000;border-left:3px solid var(--gold)}
.notepick .choices{margin-top:6px}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}}
.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000;border:2px solid var(--bad);padding:8px 12px;max-width:90vw;animation:pop .15s}
#toast div.info{border-color:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.item{display:flex;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);background:var(--bg2)}
.item img{width:36px;height:36px;background:#000;flex:none}
.item .it{flex:1;min-width:0}
.item .it b{display:block}
.item .it small{color:var(--muted);display:block;font-size:12px;line-height:1.25}
.item.sold{opacity:.45}
.reelwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reelshot{border:2px solid var(--line2);background:#000;position:relative}
.reelshot .cap{font-size:12px;padding:3px 5px;display:flex;justify-content:space-between;gap:4px}
.reelshot .tg{position:absolute;top:4px;right:4px}
.ending{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ending h1{font-size:44px;margin:0;letter-spacing:3px}
.ending .tone-good{color:var(--gold)} .ending .tone-bad{color:var(--bad)} .ending .tone-mid{color:var(--cyan)}
.endbody{white-space:pre-wrap;font-size:17px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mobile-bar{display:none}
@media (max-width:1180px){ .work{grid-template-columns:240px minmax(0,1fr)} .work .rightcol{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:12px} }
@media (max-width:860px){
  :root{--cs:54px}
  body{font-size:14px}
  #app{padding:8px 10px 110px}
  .inbox,.split2{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .work .rightcol{display:flex;flex-direction:column}
  .work .briefcol{order:2} .work .centercol{order:1} .work .rightcol{order:0}
  .hud .cell{min-width:0;padding:4px 7px} .hud .v{font-size:15px}
  .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#05060c;border-top:2px solid var(--line2);z-index:40}
  .mobile-bar .btn{flex:1}
  .desk-cook{display:none}
  .gc.node .nm{font-size:9px}
  .simrow{grid-template-columns:80px 1fr 70px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="story.js"></script>
<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script>
'use strict';
const E = VFXEngine, A = VFXArt, S = VFXStory, AU = VFXAudio;
const $ = s => document.querySelector(s);
const SAVE_KEY = 'vfxRogue.v2.save', LANG_KEY = 'vfxRogue.lang', AUDIO_KEY = 'vfxRogue.audio';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let LANG = store.get(LANG_KEY) === 'zh' ? 'zh' : 'en';
E.setLang(LANG);
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
const t = (k, v) => E.t(k, v, LANG);
const L = v => E.L(v, LANG);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const starStr = n => { if (!n) return '☆0'; const f = Math.floor(n), h = n - f >= 0.5; return '★'.repeat(f) + (h ? '½' : '') + ' ' + n; };
(function () { const a = store.get(AUDIO_KEY); if (a) { try { const o = JSON.parse(a); AU.setSfx(o.sfx !== false); } catch (e) {} } })();

let G = null;
const UI = { screen: 'title', sel: null, cell: null, msg: 0, read: {}, modal: null, heroPick: {}, sim: null, hdaFirst: null, lastRes: null, playIdx: 0, flash: 0, flashT: 0, musicWanted: false };

function persona(b) { if (b.client) return E.CLIENTS[b.client].persona; if (b.studio) return E.STUDIOS[b.studio].persona; return 'mentor'; }
function face(b) { if (b.client) return E.CLIENTS[b.client].face; if (b.studio) return S.CAST[E.STUDIOS[b.studio].rep].face; return S.CAST.mira.face; }
function who(b) { if (b.client) return { name: L(E.CLIENTS[b.client].name), co: L(E.CLIENTS[b.client].company), kind: L(E.CLIENTS[b.client].kind) }; if (b.studio) { const st = E.STUDIOS[b.studio]; return { name: L(S.CAST[st.rep].name), co: L(st.name), kind: L(st.kind) }; } return { name: L(S.CAST.you.name), co: t('board.portfolio'), kind: L(S.CAST.you.role) }; }
const portrait = (f, s) => A.portraitURL(f, s || 3);
const icon = (id, s) => { const d = E.NODE_DEFS[id]; return A.iconURL(id === 'dustpass' ? 'dust' : id, d ? A.DEPT_COLORS[d.dept] : '#e6e6e6', s || 3); };
const cardIcon = c => c.parts ? A.iconURL('hda', A.DEPT_COLORS[E.NODE_DEFS[c.parts[0]].dept], 3) : icon(c.type);
const cardName = c => c.parts ? c.parts.map(p => L(E.NODE_DEFS[p].name)).join('+') : L(E.NODE_DEFS[c.type].name);
const relicIcon = id => A.iconURL(E.RELICS[id].icon, '#e6e6e6', 3);
const elName = el => L(E.ELEMENTS[el].name);
const elChip = (el, extra) => `<span class="chip" style="border-color:${E.ELEMENTS[el].color};color:${E.ELEMENTS[el].color}">${esc(elName(el))}${extra ? ' ' + extra : ''}</span>`;
const reqName = q => L(E.reqLoc(q));
const deptOrder = ['model', 'plate', 'surf', 'char', 'fx', 'light', 'comp', 'util'];

function toast(msg, kind) {
  const d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 2600);
}
function save() {
  if (!G) return;
  if (G.phase === 'ending') { store.del(SAVE_KEY); return; }
  if (G.phase === 'inbox' || UI.sim) return;
  store.set(SAVE_KEY, G.serialize());
}

/* ================= HUD ================= */
function hud() {
  const act = G.week <= 4 ? 'hud.act1' : (G.week <= 8 ? 'hud.act2' : 'hud.act3');
  const reelN = G.reel.filter(s => !s.nda && !s.ng).length;
  return `<div class="hud">

    <div class="cell"><span class="k">${t('hud.hw')}</span><span class="v" style="font-size:13px">${t('hud.hwVal', { c: G.hw.cols, r: G.hw.rows, ram: G.hw.ram })}</span></div>
    <div class="cell grow"><span class="k">${t('hud.relics')}</span><div class="relics" data-act="relics" style="cursor:pointer">${G.relics.map(r => `<img class="px" src="${relicIcon(r)}" title="${esc(L(E.RELICS[r].name) + ' — ' + L(E.RELICS[r].desc))}">`).join('') || '<span class="dim">—</span>'}</div></div>
    <div class="cell tools">

}

/* ================= INBOX ================= */
function fill(s) { return s.replace(/\{rent\}/g, G.rentDue()); }
function viewInbox() {
  const ms = G.inbox;
  if (UI.msg >= ms.length) UI.msg = 0;
  const m = ms[UI.msg];
  if (m) UI.read[G.week + ':' + UI.msg] = true;
  const list = ms.map((x, i) => {
    const c = S.CAST[x.from];
    return `<div class="mitem ${i === UI.msg ? 'on' : ''} ${UI.read[G.week + ':' + i] ? '' : 'unread'}" data-act="msg" data-i="${i}">
      <img class="px" src="${portrait(c.face, 2)}"><div><div class="subj">${esc(L(x.subject))}</div><div class="muted" style="font-size:12px">${esc(L(c.name))}${x.choices && x.resolved == null ? ' · <span class="warn">!</span>' : ''}</div></div></div>`;
  }).join('') || `<div class="muted">${t('inbox.empty')}</div>`;
  let detail = '';
  if (m) {
    const c = S.CAST[m.from];
    detail = `<div class="mhead"><img class="px" src="${portrait(c.face, 3)}"><div><div style="font-size:19px;font-weight:700">${esc(L(m.subject))}</div><div class="muted">${t('inbox.from', { name: L(c.name) })} · ${esc(L(c.role))}</div></div></div>
      <div class="mbody">${esc(fill(L(m.body)))}</div>
      ${m.choices ? (m.resolved == null
        ? `<div class="choices"><div class="muted">${t('inbox.choose')}</div>${m.choices.map((ch, j) => `<button class="btn" data-act="choice" data-m="${UI.msg}" data-c="${j}" ${ch.cost && G.cash < ch.cost ? 'disabled' : ''}>${esc(L(ch.label))}</button>`).join('')}</div>`
        : `<div class="result">${esc(fill(L(m.result || m.choices[m.resolved].label)))}</div>`) : ''}`;
  }
  const blocked = G.inboxBlocking();
  return `<div class="inbox">
    <div class="col"><div class="panel" style="padding:4px"><canvas class="px" width="320" height="180" data-draw="apartment"></canvas></div>
      <div class="panel"><div class="ptitle">${t('inbox.title', { w: G.week })}</div><div class="mlist">${list}</div></div></div>
    <div class="col"><div class="panel">${detail}</div>
      <button class="btn gold big" data-act="toboard" ${blocked ? 'disabled' : ''}>${t('inbox.toBoard')}</button>
      ${blocked ? `<div class="warn">${t('inbox.pending')}</div>` : ''}</div>
  </div>`;
}

/* ================= BOARD ================= */
function reqChips(b, showHidden) {
  const chips = b.reqs.map(q => `<span class="chip">${esc(reqName(q))}</span>`);
  (b.revealed || []).forEach(q => chips.push(`<span class="chip">${esc(reqName(q))}</span>`));
  if (b.hidden && !(b.revealed || []).length && showHidden !== false) chips.push(`<span class="chip hid">${t('board.hiddenReq')}</span>`);
  return chips.join(' ');
}
function heroPicker(key, def) {
  const cur = UI.heroPick[key] || def || 'fire';
  UI.heroPick[key] = cur;
  return `<div class="muted" style="font-size:13px">${t('board.pickHero')}</div><div class="row">${E.ELEMENT_IDS.map(el => `<span class="elchip ${el === cur ? 'on' : ''}" style="border-color:${E.ELEMENTS[el].color};color:${E.ELEMENTS[el].color}" data-act="pickhero" data-k="${key}" data-el="${el}">${esc(elName(el))}</span>`).join('')}</div>`;
}
function hoursFor(b) { return E.CONFIG.baseHours + (b.hoursMod || 0) + G.bonusHoursNext + (G.hasRelic('caffeine') ? 5 : 0) + (G.hasRelic('backup') ? 2 : 0) + (G.flags.hoursPenalty || 0); }
function viewBoard() {
  const B = G.board;
  const cards = [];
  B.gigs.forEach((b, i) => {
    const w = who(b); const p = persona(b);
    cards.push(`<div class="panel job gig">
      <div class="who"><img class="px" src="${portrait(face(b))}"><div><span class="kind">${t('board.gig')}</span><div class="ttl">${esc(L(b.title))}</div><div class="muted" style="font-size:13px">${esc(w.co)} · ${esc(w.kind)}</div></div></div>
      <div class="row"><span class="tag">${t('board.persona.' + p)}</span><span class="tag">${t('board.hours', { h: hoursFor(b) })}</span></div>
      <div><span class="muted">${t('board.hero')}:</span> ${elChip(b.hero, '★' + b.minStars + '+')}</div>
      <div><span class="muted">${t('board.reqs')}:</span> ${reqChips(b)}</div>
      <div class="muted" style="font-style:italic;font-size:13px">“${esc(L(E.CLIENTS[b.client].hello))}”</div>
      <div class="${b.nda ? 'warn' : 'good'}" style="font-size:13px">${b.nda ? '🔒 ' + t('board.nda') : '🎞 ' + t('board.reelOk')}</div>
      <div class="foot"><span class="goldt" style="font-size:18px;font-weight:700">${t('board.payVal', { n: b.pay })}</span><button class="btn gold" data-act="take" data-kind="gig" data-i="${i}">${t('board.take')}</button></div></div>`);
  });
  if (B.portfolio) {
    const b = B.portfolio;
    cards.push(`<div class="panel job portfolio">
      <div class="who"><img class="px" src="${portrait(S.CAST.you.face)}"><div><span class="kind">${t('board.portfolio')}</span><div class="ttl">${esc(L(b.title))}</div></div></div>
      <div class="muted" style="font-size:13px">${t('board.portfolioDesc')}</div>
      ${heroPicker('portfolio', E.BACKGROUNDS[G.bg].el || 'fire')}
      <div><span class="muted">${t('board.reqs')}:</span> ${reqChips(b)}</div>
      <div class="row"><span class="tag">${t('board.hours', { h: hoursFor(b) })}</span></div>
      <div class="foot"><span class="dim">${t('board.noPay')}</span><button class="btn pink" data-act="take" data-kind="portfolio" data-i="0">${t('board.make')}</button></div></div>`);
  }
  if (B.test) {
    const b = B.test, st = E.STUDIOS[b.studio], gate = B.testGate;
    cards.push(`<div class="panel job test ${gate.ok ? '' : 'locked'}">
      <div class="who"><img class="px" src="${portrait(S.CAST[st.rep].face)}"><div><span class="kind">${t('board.test')}</span><div class="ttl">${esc(L(st.name))}</div><div class="muted" style="font-size:13px">${esc(L(st.kind))}</div></div></div>
      <div class="muted" style="font-size:13px">${t('board.testDesc')}</div>
      <div><div class="muted">${t('board.gate')}:</div>${gate.lines.map(l => `<div class="gate-line ${l.ok ? 'good' : 'bad'}">${l.ok ? '✓' : '✗'} ${esc(t(l.key, l.vars))}</div>`).join('')}</div>
      ${heroPicker('test', b.defaultHero)}
      <div><span class="muted">${t('board.hero')}:</span> ★${b.minStars}+ · <span class="muted">${t('board.reqs')}:</span> ${reqChips(b)}</div>
      <div class="row"><span class="tag">${t('board.persona.' + st.persona)}</span><span class="tag">${t('board.hours', { h: hoursFor(b) })}</span></div>
      <div class="foot"><span class="goldt">OFFER</span><button class="btn gold" data-act="take" data-kind="test" data-i="0" ${gate.ok ? '' : 'disabled'}>${gate.ok ? t('board.attempt') : '🔒 ' + t('board.locked')}</button></div></div>`);
  }
  return `<div class="panel" style="margin-bottom:12px"><div style="font-size:22px;font-weight:700">${t('board.title')}</div><div class="muted">${t('board.sub')}</div></div><div class="board">${cards.join('')}</div>`;
}

/* ================= WORK ================= */
function streamColor(s) {
  if (!s) return '#3a4060';
  if (s.dead) return '#ff3a5a';
  if (s.final) return '#ffd84a';
  if (s.lit) return '#4f9cf0';
  const el = E.ELEMENT_IDS.find(e => s.step[e] > 0);
  if (el) return E.ELEMENTS[el].color;
  if (s.plate && !s.geo) return '#7fc8a9';
  return '#9aa7b8';
}
function viewWork() {
  const j = G.job, b = j.brief;
  const ev = G.preview();
  UI.ev = ev;
  const best = ev.best;
  const bestStream = best && best.row != null ? ev.rowOut[best.row] : null;
  UI.previewLook = bestStream ? E.snapshotLook(bestStream, G.relicSet()) : null;
  const w = who(b);
  // brief
  const allReqs = b.reqs.concat(b.revealed || []);
  const reqRows = allReqs.map(q => {
    const ok = bestStream && !bestStream.dead && E.REQS[q.id].test(bestStream, q.n);
    return `<div class="req ${ok ? 'ok' : 'no'}"><span class="b">${ok ? '✓' : '✗'}</span><div>${esc(reqName(q))}<small>${esc(L(E.REQS[q.id].hint))}</small></div></div>`;
  }).join('') + (b.hidden && !(b.revealed || []).length ? `<div class="req hid"><span class="b">?</span><div>${t('board.hiddenReq')}</div></div>` : '');
  const curStars = best ? best.stars : 0;
  const heroOk = curStars >= b.minStars;
  const freshSims = j.grid.flat().filter((c, i) => c && E.isSolverCard(c)).length;
  const notes = j.notes.map((n, i) => n.lines.map(l => `<div class="note"><div class="nh">#${i + 1} · ${esc(w.name)}</div>${esc(L(l))}</div>`).join('')).reverse().join('') || `<div class="dim">${t('work.noNotes')}</div>`;
  const notePick = j.pendingNote ? `<div class="notepick"><div class="muted" style="font-size:12px">${t('note.choose')}</div><div class="choices">${j.pendingNote.options.map(o => `<button class="btn" data-act="notechoice" data-k="${o.key}">${esc(L(o.label))}</button>`).join('')}</div></div>` : '';
  let tut = '';
  if (b.tutorial) {
    const placed = j.grid.flat().filter(Boolean);
    const k = !placed.length ? 'work.tutorial1' : (!(bestStream && bestStream.lit) ? 'work.tutorial2' : 'work.tutorial3');
    tut = `<div class="tut"><img class="px" src="${portrait(S.CAST.mira.face, 2)}"><div>${t(k)}</div></div>`;
  }
  const brief = `<div class="panel brief">
    <div class="ptitle">${t('work.brief')}</div>
    <div class="who"><img class="px" src="${portrait(face(b))}"><div><div style="font-weight:700;font-size:17px">${esc(L(b.title))}</div><div class="muted" style="font-size:12px">${esc(w.co)} · ${esc(w.name)}</div><span class="tag">${t('board.persona.' + persona(b))}</span></div></div>
    ${notePick}
    <div class="req ${heroOk ? 'ok' : 'no'}" style="font-size:16px"><span class="b">${heroOk ? '✓' : '✗'}</span><div>${t('work.hero', { el: elName(b.hero), n: b.minStars })}<small>${t('work.predicted')}: <span class="stars">${starStr(curStars)}</span>${freshSims ? ' + sim' : ''}</small></div></div>
    <div class="ptitle" style="margin-top:8px">${t('work.reqs')}</div><div class="reqlist">${reqRows}</div>
    <div class="stat"><span>${t('work.polish', { n: best ? best.polish : 0 })}</span><span class="g-${best ? best.grade : 'F'}" style="font-weight:700">${t('work.gradePreview', { g: best ? best.grade : 'F' })}</span></div>
    ${b.kind === 'gig' ? `<div class="stat"><span class="muted">${t('board.pay')}</span><span class="goldt">${t('board.payVal', { n: b.pay })}</span></div>` : ''}
    ${b.payBoost && b.payBoostDailies && j.dailiesUsed === b.payBoostDailies ? `<div class="good" style="font-size:13px">${t('work.easyBoost')}</div>` : ''}
    ${b.payBoostLost ? `<div class="bad" style="font-size:13px">${t('work.easyLost')}</div>` : ''}
    <div class="ptitle" style="margin-top:10px">${t('work.notes')}</div><div class="notes">${notes}</div>
  </div>`;
  // grid
  const R = ev.R, C = ev.C;
  let cells = '';
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const card = j.grid[r][c];
      const key = r + ',' + c;
      const cl = ev.cells[r][c];
      if (!card) { cells += `<div class="gc empty" data-act="cell" data-r="${r}" data-c="${c}" data-drop="1"></div>`; continue; }
      const d = E.NODE_DEFS[E.cardParts(card)[0]];
      const col = A.DEPT_COLORS[d.dept];
      const err = cl.status === 'err';
      cells += `<div class="gc node ${err ? 'err' : ''} ${UI.cell === key ? 'sel' : ''}" style="border-color:${err ? 'var(--bad)' : col}" data-act="cell" data-r="${r}" data-c="${c}" data-drop="1" draggable="true" data-uid="${card.uid}" title="${esc(cardName(card) + (err ? ' — ' + t(cl.err) : ''))}">
        <img class="px" src="${cardIcon(card)}"><span class="nm">${esc(cardName(card))}</span>
        ${err ? '<span class="badge b-err">!</span>' : ''}
        ${ev.cached[key] ? '<span class="badge b-cache">✓</span>' : ''}
        ${E.isSolverCard(card) ? `<span class="badge b-solv">SIM</span>` : ''}
        ${cl.collision ? '<span class="badge b-col">◈</span>' : ''}
        ${(card.q || 1) > 1 ? `<span class="badge b-q">Q${card.q}</span>` : ((card.up || 0) > 0 ? '<span class="badge b-q">M</span>' : '')}
      </div>`;
    }
    const s = ev.rowOut[r];
    const st = s ? E.streamStars(s, G.relicSet(), b.hero) : 0;
    const isBest = best && best.row === r && s;
    cells += `<div class="gc out ${isBest ? 'best' : ''}"><span class="dim" style="font-family:var(--mono);font-size:9px">${t('work.out')}</span>${s ? (s.dead ? '<span class="bad">NaN</span>' : `<span class="ostar">★${st}</span><span style="font-size:9px;color:${streamColor(s)}">${s.final ? 'FINAL' : (s.lit ? 'RENDER' : 'PLAYBLAST')}</span>`) : '<span class="dim">—</span>'}</div>`;
  }
  const ramBars = ev.colRam.map(v => { const f = v / G.hw.ram; return `<div class="${f > 1 ? 'over' : (f > .75 ? 'hot' : '')}" title="${v}/${G.hw.ram} GB"><i style="width:${Math.min(100, f * 100)}%"></i></div>`; }).join('');
  // toolkit
  const used = G.placedUids();
  const free = G.cards.filter(c => !used.has(c.uid));
  free.sort((a, b2) => deptOrder.indexOf(E.cardDept(a)) - deptOrder.indexOf(E.cardDept(b2)) || a.type.localeCompare(b2.type));
  let tray = ''; let lastD = null;
  for (const c of free) {
    const d = E.cardDept(c);
    if (d !== lastD) { tray += `<div class="dgroup" style="color:${A.DEPT_COLORS[d]}">${esc(L(E.DEPTS[d].name))}</div>`; lastD = d; }
    tray += `<div class="tcard ${UI.sel === c.uid ? 'on' : ''}" data-act="tsel" data-uid="${c.uid}" draggable="true" style="border-left:4px solid ${A.DEPT_COLORS[d]}" title="${esc(c.parts ? cardName(c) : L(E.NODE_DEFS[c.type].desc))}">
      <img class="px" src="${cardIcon(c)}"><div><div class="tn">${esc(cardName(c))}${(c.up || 0) ? ' ★' : ''}</div><div class="tm">${E.cardHours(c, G.relicSet())}H · ${E.cardRam(c)}GB${E.isSolverCard(c) ? ' · SIM' : ''}</div></div></div>`;
  }
  const center = `${tut}<div class="panel"><div class="ptitle">${t('work.shot')}</div>
    <div class="gridwrap"><div class="gridbox" id="gridbox" style="grid-template-columns:repeat(${C + 1},var(--cs))">
    <svg id="wires"></svg>${cells}</div><div class="colram">${ramBars}</div></div></div>
    <div class="panel" style="margin-top:12px"><div class="ptitle">${t('work.toolkit')} · <span class="dim">${t('work.toolkitHint')}</span></div><div class="tray">${tray || '<span class="dim">—</span>'}</div></div>`;
  // right
  const capKey = !bestStream ? 'work.cap.unlit' : (!bestStream.lit ? 'work.cap.unlit' : (!bestStream.final ? 'work.cap.nocomp' : 'work.cap.none'));
  const cookErr = j.pendingNote ? 'err.noteChoice' : (j.dailiesUsed >= j.dailiesMax ? 'err.noDailies' : (ev.oom ? 'err.oom' : (ev.cost > j.hoursLeft ? 'err.hours' : null)));
  const pips = Array.from({ length: j.dailiesMax }, (_, i) => `<i class="${i < j.dailiesUsed ? 'on' : ''}"></i>`).join('');
  const farmP = G.farmPrice();
  const right = `<div class="panel"><div class="ptitle">${t('work.viewport')}</div>
      <div class="vpwrap"><canvas class="px" width="160" height="90" data-draw="shot" data-src="preview" id="vp"></canvas><span class="vpcap">${j.last ? 'DAILIES ' + j.dailiesUsed : 'PREVIEW'} · ${esc(t(capKey))}</span></div>
      <div class="stat" style="margin-top:8px"><span>${t('work.hours')}</span><span class="${cookErr === 'err.hours' ? 'bad' : ''}">${t('work.hoursVal', { cost: ev.cost, left: j.hoursLeft })}</span></div>
      <div class="bar"><i style="width:${Math.min(100, j.hoursLeft / j.hoursTotal * 100)}%"></i><b style="left:${Math.max(0, (j.hoursLeft - ev.cost) / j.hoursTotal * 100)}%;width:${Math.min(100, ev.cost / j.hoursTotal * 100)}%"></b></div>
      <div class="stat"><span>${t('work.ram')}</span><span class="${ev.oom ? 'bad' : ''}">${t('work.ramVal', { peak: ev.ramPeak, max: G.hw.ram })}</span></div>
      <div class="stat"><span>${t('work.dailies')}</span><span class="pips">${pips}</span></div>
      <div class="cookbar desk-cook">
        <button class="btn gold big" data-act="cook" ${cookErr ? 'disabled title="' + esc(t(cookErr)) + '"' : ''}>${t('work.cook')}</button>
        <button class="btn pink big" data-act="deliver" ${j.last && !j.pendingNote ? '' : 'disabled'}>${t('work.deliver')}</button>
      </div>
      <div class="row" style="margin-top:8px;justify-content:space-between">
        <button class="btn small cyan" data-act="farm" ${j.farmBought >= E.CONFIG.farmMaxPerJob || G.cash < farmP ? 'disabled' : ''}>${j.farmBought >= E.CONFIG.farmMaxPerJob ? t('work.farmMax') : t('work.farm', { h: E.CONFIG.farmHours, p: farmP })}</button>
        <button class="btn small ghost" data-act="abandon">${t('work.abandon')}</button>

function drawWires() {
  const box = $('#gridbox'), svg = $('#wires');
  if (!box || !svg || !UI.ev) return;
  const ev = UI.ev, R = ev.R, C = ev.C;
  const br = box.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);
  svg.setAttribute('width', br.width); svg.setAttribute('height', br.height);
  const cellsEl = box.querySelectorAll('.gc');
  const pos = (r, c) => { const el = cellsEl[r * (C + 1) + c]; const b = el.getBoundingClientRect(); return [b.left - br.left + b.width / 2, b.top - br.top + b.height / 2]; };
  let out = '';
  const line = (a, b, col, dash, w) => { out += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${w || 4}" ${dash ? 'stroke-dasharray="6 5"' : 'stroke-dasharray="10 4" class="flow"'} stroke-linecap="square"/>`; };
  for (let r = 0; r < R; r++) {
    for (let c = 1; c < C; c++) {
      const prev = ev.streams[r][c - 1];
      const card = G.job.grid[r][c];
      const d = card ? E.NODE_DEFS[E.cardParts(card)[0]] : null;
      if (prev && !(d && d.source)) {
        const err = card && ev.cells[r][c].status === 'err';
        line(pos(r, c - 1), pos(r, c), err ? '#ff3a5a' : streamColor(prev), err);
      }
      if (d && d.merge) {
        if (r > 0 && ev.streams[r - 1][c - 1]) line(pos(r - 1, c - 1), pos(r, c), streamColor(ev.streams[r - 1][c - 1]));
        if (r < R - 1 && ev.streams[r + 1][c - 1]) line(pos(r + 1, c - 1), pos(r, c), streamColor(ev.streams[r + 1][c - 1]));
      }
    }
    const o = ev.rowOut[r];
    if (o) line(pos(r, C - 1), pos(r, C), streamColor(o));
  }
  svg.innerHTML = `<style>.flow{animation:flow 0.9s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}</style>` + out;
}

/* ================= COOK / SIM ================= */
function doCook() {
  // The pincher's hours/pay choice comes with the brief; don't let the
  // keyboard shortcut silently take the default.
  if (G.job && G.job.pendingNote) { AU.play('error'); toast(t('err.noteChoice')); return; }
  const p = G.prepareCook();
  if (!p.ok) { AU.play('error'); toast(t(p.reason)); return; }
  AU.play('cook');
  if (!p.sims.length) { finishCook({}); return; }
  UI.sim = { plan: p, states: p.sims.map(s => ({ sim: s, st: E.simInit(s.params, s.seed), rng: E.mulberry32(s.seed), cachedAt: null })), timer: null, started: false, done: false };
  UI.modal = { type: 'sim' };
  renderModal();
  setTimeout(simStart, 700);
}
function simStart() {
  const S_ = UI.sim; if (!S_ || S_.started) return;
  S_.started = true;
  S_.timer = setInterval(simTick, 115);
}
function simTick() {
  const S_ = UI.sim; if (!S_) return;
  let alive = 0;
  S_.states.forEach(x => {
    if (x.st.done) return;
    E.simStep(x.st, x.rng);
    if (x.st.diverged) { AU.play('diverge'); const m = $('#mbox'); if (m) { m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); } }
    else if (E.simBand(x.st.inst, x.st.bandShift) === 'danger') AU.play('warn');
    else AU.play('tick');
    if (!x.st.done) alive++;
  });
  if (!alive) { clearInterval(S_.timer); S_.done = true; }
  updateSimDom();
}
function simCache(i) {
  const S_ = UI.sim; if (!S_) return;
  const list = i == null ? S_.states : [S_.states[i]];
  list.forEach(x => { if (!x.st.done) { x.st.done = true; x.cachedAt = x.st.f; AU.play('cache'); } });
  if (S_.states.every(x => x.st.done)) { clearInterval(S_.timer); S_.done = true; }
  updateSimDom();
}
function simFinish() {
  const S_ = UI.sim; if (!S_) return;
  clearInterval(S_.timer);
  const outcomes = {};
  S_.states.forEach(x => { outcomes[x.sim.key] = { detail: x.st.detail, diverged: x.st.diverged, f: x.st.f }; });
  UI.sim = null;
  finishCook(outcomes);
}
function finishCook(outcomes) {
  const res = G.commitCook(outcomes);
  if (!res.ok) { AU.play('error'); toast(t(res.reason)); UI.modal = null; renderModal(); render(); return; }
  UI.lastRes = res;
  UI.flash = 1; UI.flashT = performance.now();
  const g = res.grade;
  AU.play(g && g.pass ? (g.grade === 'S' || g.grade === 'A' ? 'great' : 'good') : 'bad');
  UI.modal = { type: 'result' };
  render(); renderModal();
}
function simRowsHTML() {
  const S_ = UI.sim;
  return S_.states.map((x, i) => {
    const d = E.NODE_DEFS[x.sim.type];
    const det = Math.min(130, x.st.detail);
    const bonus = x.st.diverged ? 0 : E.simBonus(x.st.detail);
    const band = x.st.diverged ? 'danger' : E.simBand(x.st.inst, x.st.bandShift);
    const ticks = E.CONFIG.solver.thresholds.map(th => `<span class="tick" style="left:${th / 130 * 100}%"></span>`).join('');
    const pips = ['steady', 'warn', 'danger'].map(b => `<span class="bandpip ${b}${band === b ? ' on' : ''}">${t('sim.band.' + b)}</span>`).join('');
    const state = x.st.diverged ? `<span class="bad">${t('sim.diverged')}</span>` : (x.cachedAt != null ? `<span class="good">${t('sim.cachedAt', { f: x.cachedAt })}</span>` : (x.st.done ? `<span class="good">✓</span>` : `<button class="btn small gold" data-act="simcache" data-i="${i}">${t('sim.cache')}</button>`));
    return `<div class="simrow" id="simrow${i}">
      <div><div style="font-weight:700;color:${E.ELEMENTS[x.sim.params.el].color}">${esc(L(d.name))}</div><div class="dim" style="font-size:11px">${t('sim.frame', { f: x.st.f, n: x.sim.params.frames })}</div></div>
      <div><div class="simbar" title="${t('sim.detail')}"><i style="width:${det / 130 * 100}%;background:var(--cyan)"></i>${ticks}</div>
        <div class="bandrow">${pips}</div>
        <div class="row" style="justify-content:space-between;font-size:11px"><span class="muted">${t('sim.detail')} ${Math.round(x.st.detail)} · <span class="goldt">${t('sim.bonus', { n: bonus })}</span></span><span class="dim">${t('sim.instBand')}</span></div>
        ${x.sim.predict ? `<div class="dim" style="font-size:11px">${t('sim.wedge', { f: x.sim.predict })}</div>` : ''}</div>
      <div style="text-align:right">${state}</div></div>`;
  }).join('');
}

  if (m.type === 'result') {
    const r = UI.lastRes, g = r.grade, j = G.job;
    const fails = r.fresh.map(f => f.pip ? `<div class="good">🐈 ${t('res.pip')}</div>` : (f.backup ? `<div class="good">💾 ${t('res.backup')}</div>` : `<div class="bad">⚠ ${t('res.fail.' + f.dept)}</div>`)).join('');
    const notes = r.notes.lines.map(l => `<div class="note">${esc(L(l))}</div>`).join('');
    const notePick = j.pendingNote ? `<div class="notepick"><div class="muted" style="font-size:12px">${t('note.choose')}</div><div class="choices">${j.pendingNote.options.map(o => `<button class="btn" data-act="notechoice" data-k="${o.key}">${esc(L(o.label))}</button>`).join('')}</div></div>` : '';
    const b = j.brief;
    h = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">${t('res.title', { n: j.dailiesUsed })}</h2><span class="muted">${t('res.spent', { h: r.cost })} · ${t('res.cached', { n: j.last.cachedCount })}</span></div>
      <div class="split2" style="margin-top:8px"><div><canvas class="px" width="160" height="90" data-draw="shot" data-src="last"></canvas></div>
      <div class="col"><div class="row"><div class="gradebig stamp g-${g.grade}">${g.grade}</div><div><div class="stars" style="font-size:18px">${starStr(g.stars)}</div><div class="muted">${t('work.polish', { n: g.polish })}</div></div></div>
        ${fails}${r.oomRow != null ? `<div class="bad">${t('res.oom', { r: r.oomRow + 1 })}</div>` : ''}
        <div class="row"><img class="px" src="${portrait(face(b), 2)}" style="width:40px;height:40px"><b>${esc(who(b).name)}</b></div>${notes}${notePick}
        ${b.payBoost && b.payBoostDailies && j.dailiesUsed === b.payBoostDailies ? `<div class="good" style="font-size:13px">${t('work.easyBoost')}</div>` : ''}
        ${b.payBoostLost ? `<div class="bad" style="font-size:13px">${t('work.easyLost')}</div>` : ''}</div></div>
      <div class="row" style="margin-top:12px"><button class="btn gold" data-act="close">${t('res.ok')}</button>${g.pass ? `<button class="btn pink" data-act="deliver" ${j.pendingNote ? 'disabled' : ''}>${t('work.deliver')}</button>` : ''}</div>`;
  }
  if (m.type === 'confirmDeliver') h = `<h3 style="margin-top:0">${t('work.confirmDeliver')}</h3><div class="row"><button class="btn pink" data-act="deliverYes">${t('work.deliver')}</button><button class="btn" data-act="close">${t('ui.back')}</button></div>`;
  if (m.type === 'confirmAbandon') h = `<h3 style="margin-top:0">${t('work.abandonQ')}</h3><div class="row"><button class="btn pink" data-act="abandonYes">${t('ui.yes')}</button><button class="btn" data-act="close">${t('ui.no')}</button></div>`;
  if (m.type === 'pick') {
    const cs = G.cards.filter(c => m.filter ? m.filter(c) : true);
    h = `<h3 style="margin-top:0">${m.title}</h3><div class="shop">${cs.map(c => `<div class="item" data-act="picked" data-uid="${c.uid}" style="cursor:pointer;${UI.hdaFirst === c.uid ? 'border-color:var(--gold)' : ''}"><img class="px" src="${cardIcon(c)}"><div class="it"><b>${esc(cardName(c))}${c.up ? ' ★' : ''}</b><small>${E.cardHours(c, G.relicSet())}h</small></div></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" data-act="close">${t('wk.cancel')}</button></div>`;
  }
  if (m.type === 'play') {
    const list = G.reel.filter(s => !s.nda);
    const s = list[UI.playIdx % list.length];
    h = `<canvas class="px" width="160" height="90" data-draw="shot" data-src="reel:${G.reel.indexOf(s)}"></canvas>
      <div class="row" style="justify-content:space-between;margin-top:8px"><div><b style="font-size:18px">${esc(L(s.title))}</b> <span class="stars">★${s.stars}</span><div class="muted">W${s.week} · ${esc(s.client ? L(E.CLIENTS[s.client].company) : (s.studio ? L(E.STUDIOS[s.studio].name) : t('board.portfolio')))}</div></div><span class="dim">${(UI.playIdx % list.length) + 1}/${list.length}</span></div>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="close">${t('ui.close')}</button></div>`;
  }
  box.innerHTML = h;
  bindCanvases();
}

/* ================= canvas animation ================= */
let canvases = [];
function bindCanvases() { canvases = Array.from(document.querySelectorAll('canvas[data-draw]')).map(c => ({ c, ctx: c.getContext('2d') })); }
function lookFor(src) {
  if (src === 'preview') return UI.previewLook;
  if (src === 'last') { const j = G && G.job; return j && j.last && j.last.stream ? E.snapshotLook(j.last.stream, G.relicSet()) : (j && j.last ? { dead: true, model: 'box' } : null); }
  if (src && src.startsWith('reel:')) { const s = G.reel[+src.slice(5)]; return s ? (s.look || { dead: true }) : null; }
  return null;
}
function frame(now) {
  for (const { c, ctx } of canvases) {
    if (!c.isConnected) continue;
    const kind = c.dataset.draw;
    ctx.save();
    if (kind === 'title') A.drawTitle(ctx, now);
    else if (kind === 'apartment') A.drawApartment(ctx, now, { night: true, week: G ? G.week : 1, reel: G ? G.reel.filter(s => !s.nda && !s.ng).length : 0, catOnDesk: G && G.hasRelic('pip'), monitors: G && G.hasRelic('monitor') ? 2 : 1, rain: G && G.week % 3 === 1, gpuGlow: G && G.hw.rows > 2 });
    else if (kind === 'shot') {
      const fl = UI.flash && c.id === 'vp' ? Math.max(0, 1 - (now - UI.flashT) / 500) : 0;
      A.drawShot(ctx, lookFor(c.dataset.src), { t: now, flash: fl });
    }
    else if (kind === 'sim' && UI.sim) A.drawSim(ctx, UI.sim.states.map(x => ({ el: x.sim.params.el, f: x.st.f, detail: x.st.detail, inst: x.st.inst, band: E.simBand(x.st.inst, x.st.bandShift), diverged: x.st.diverged, done: x.st.done })), now);
    else if (kind === 'ending') A.drawEnding(ctx, c.dataset.id, now);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ================= main render ================= */
function render() {
  const app = $('#app');
  let h = '';
  if (UI.screen === 'title' || !G) h = UI.screen === 'bg' ? viewBg() : viewTitle();
  else {
    switch (G.phase) {
      case 'inbox': h = hud() + viewInbox(); break;
      case 'board': h = hud() + viewBoard(); break;
      case 'work': h = hud() + viewWork(); break;
      case 'delivered': h = hud() + viewDelivered(); break;
      case 'weekend': h = hud() + viewWeekend(); break;
      case 'ending': h = viewEnding(); break;
    }
  }
  app.innerHTML = h;
  bindCanvases();
  if (G && G.phase === 'work') requestAnimationFrame(drawWires);
  save();
}

/* ================= actions ================= */
function placeSel(r, c) {
  const j = G.job;
  const existing = j.grid[r][c];
  if (UI.sel) {
    G.place(UI.sel, r, c);
    AU.play('place');
    UI.sel = null; UI.cell = r + ',' + c;
  } else if (existing) {
    UI.cell = UI.cell === r + ',' + c ? null : r + ',' + c;
    AU.play('click');
  } else if (UI.cell) {
    // move selected placed node to empty cell
    const [pr, pc] = UI.cell.split(',').map(Number);
    const moving = j.grid[pr][pc];
    if (moving) { G.place(moving.uid, r, c); AU.play('place'); UI.cell = r + ',' + c; }
  }
}
const ACT = {
  newrun() { store.del(SAVE_KEY); UI.screen = 'bg'; AU.play('click'); render(); },
  totitle() { UI.screen = 'title'; render(); },
  continue() { const s = store.get(SAVE_KEY); if (!s) return; try { G = E.Game.restore(s); UI.screen = 'game'; AU.play('good'); } catch (e) { store.del(SAVE_KEY); toast('Save corrupted'); } render(); },
  pickbg(d) { G = new E.Game().start(d.id); UI.screen = 'game'; UI.msg = 0; UI.read = {}; AU.play('meow'); render(); },
  lang() { LANG = LANG === 'en' ? 'zh' : 'en'; E.setLang(LANG); store.set(LANG_KEY, LANG); document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en'; document.title = t('app.title'); render(); renderModal(); },
  music() { UI.musicWanted = !UI.musicWanted; AU.setMusic(UI.musicWanted); render(); },
  sfx() { AU.setSfx(!AU.sfx); store.set(AUDIO_KEY, JSON.stringify({ sfx: AU.sfx })); render(); },
  help() { UI.modal = { type: 'help' }; renderModal(); },
  reel() { UI.modal = { type: 'reel' }; renderModal(); },
  deck() { UI.modal = { type: 'deck' }; renderModal(); },
  relics() { UI.modal = { type: 'relics' }; renderModal(); },
  close() { if (UI.modal && UI.modal.type === 'sim') return; UI.modal = null; renderModal(); render(); },
  msg(d) { UI.msg = +d.i; AU.play('page'); render(); },
  choice(d) { const r = G.resolveEvent(+d.m, +d.c); if (!r.ok) { AU.play('error'); toast(t(r.reason || 'err.cash')); } else AU.play('notify'); render(); },
  toboard() { if (G.toBoard()) { AU.play('click'); UI.heroPick = {}; render(); } },
  pickhero(d) { UI.heroPick[d.k] = d.el; AU.play('click'); render(); },
  take(d) {
    const r = G.chooseJob(d.kind, +d.i, d.kind === 'portfolio' ? UI.heroPick.portfolio : (d.kind === 'test' ? UI.heroPick.test : null));
    if (!r.ok) { AU.play('error'); toast(t(r.reason || 'err.gate')); return; }
    UI.sel = null; UI.cell = null; AU.play('good'); render();
  },
  tsel(d) { UI.sel = UI.sel === d.uid ? null : d.uid; UI.cell = null; AU.play('click'); render(); },
  cell(d) { placeSel(+d.r, +d.c); render(); },
  unplace() { if (!UI.cell) return; const [r, c] = UI.cell.split(',').map(Number); G.remove(r, c); UI.cell = null; AU.play('remove'); render(); },
  quality(d) { G.setQuality(d.uid, +d.q); AU.play('click'); render(); },
  resim(d) { G.resim(d.uid); AU.play('remove'); render(); },
  farm() { const r = G.rentFarm(); if (!r.ok) { AU.play('error'); toast(t(r.reason)); } else AU.play('cash'); render(); },
  cook() { doCook(); },
  simcache(d) { simCache(d.i != null ? +d.i : null); },
  simfinish() { simFinish(); },
  notechoice(d) { const r = G.resolveNote(d.k); if (!r.ok) { AU.play('error'); return; } AU.play('click'); if (UI.modal && UI.modal.type === 'result') renderModal(); render(); },
  deliver() { UI.modal = { type: 'confirmDeliver' }; renderModal(); },
  deliverYes() { const r = G.deliver(); UI.modal = null; renderModal(); AU.play(r.pass ? 'great' : 'bad'); if (r.pay) setTimeout(() => AU.play('cash'), 500); render(); window.scrollTo(0, 0); },
  abandon() { UI.modal = { type: 'confirmAbandon' }; renderModal(); },
  abandonYes() { G.abandon(); UI.modal = null; renderModal(); AU.play('bad'); render(); },
  offer(d) { G.acceptOffer(d.a === '1'); AU.play(d.a === '1' ? 'great' : 'good'); if (G.phase !== 'ending') { G.toWeekend(); AU.play('rent'); } render(); window.scrollTo(0, 0); },
  toweekend() { G.toWeekend(); AU.play(G.phase === 'ending' ? (G.ending.id === 'dream' ? 'great' : 'bad') : 'rent'); render(); window.scrollTo(0, 0); },
  buy(d) { const r = G.buy(d.k, d.i != null ? +d.i : undefined); if (!r.ok) { AU.play('error'); toast(t(r.reason || 'err.cash')); } else AU.play('buy'); render(); },
  practice() { UI.modal = { type: 'pick', title: t('wk.practice'), mode: 'practice', filter: c => !c.parts }; renderModal(); },
  hda() { UI.hdaFirst = null; UI.modal = { type: 'pick', title: t('wk.hdaPick'), mode: 'hda', filter: c => !c.parts }; renderModal(); },
  picked(d) {
    const m = UI.modal;
    if (m.mode === 'practice') { const r = G.buy('practice', d.uid); UI.modal = null; renderModal(); if (r.ok) AU.play('buy'); else { AU.play('error'); toast(t(r.reason || 'err.cash')); } render(); return; }
    if (m.mode === 'hda') {
      if (!UI.hdaFirst) { UI.hdaFirst = d.uid; AU.play('click'); renderModal(); return; }
      const r = G.buy('hda', UI.hdaFirst, d.uid); UI.hdaFirst = null; UI.modal = null; renderModal();
      if (r.ok) AU.play('great'); else { AU.play('error'); toast(t(r.reason || 'err.hdaOrder')); }
      render();
    }
  },
  nextweek() { G.nextWeek(); UI.msg = 0; AU.play('notify'); render(); window.scrollTo(0, 0); },
  playreel() { UI.playIdx = 0; UI.modal = { type: 'play' }; renderModal(); clearInterval(UI.playTimer); UI.playTimer = setInterval(() => { if (!UI.modal || UI.modal.type !== 'play') { clearInterval(UI.playTimer); return; } UI.playIdx++; renderModal(); }, 3200); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && UI.modal && !['sim', 'result'].includes(UI.modal.type)) { UI.modal = null; renderModal(); } });
// drag & drop
document.addEventListener('dragstart', e => {
  const el = e.target.closest('[draggable="true"]'); if (!el || !G || G.phase !== 'work') return;
  e.dataTransfer.setData('text/plain', el.dataset.uid);
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => { const c = e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('[data-drop]'); if (c) c.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const c = e.target.closest('[data-drop]'); if (!c || !G || !G.job) return;
  e.preventDefault();
  const uid = e.dataTransfer.getData('text/plain'); if (!uid) return;
  const r = +c.dataset.r, col = +c.dataset.c;
  const occupant = G.job.grid[r][col];
  // swap if dragging a placed node onto another placed node
  let from = null;
  G.job.grid.forEach((row, rr) => row.forEach((x, cc) => { if (x && x.uid === uid) from = [rr, cc]; }));
  G.place(uid, r, col);
  if (occupant && occupant.uid !== uid && from) G.place(occupant.uid, from[0], from[1]);
  UI.sel = null; UI.cell = r + ',' + col; AU.play('place'); render();
});
document.addEventListener('keydown', e => {
  if (!G || G.phase !== 'work' || UI.modal) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { if (UI.cell) { ACT.unplace(); e.preventDefault(); } }
  if (e.key === 'Escape') { UI.sel = null; UI.cell = null; render(); }
  if (e.key === 'Enter' || e.key === ' ') { if (e.target === document.body) { e.preventDefault(); doCook(); } }
});
window.addEventListener('resize', () => { if (G && G.phase === 'work') drawWires(); });
document.title = t('app.title');
render();
requestAnimationFrame(frame);
</script>
